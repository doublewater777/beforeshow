<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开场前 BeforeShow · 小组件设计稿</title>

  <!-- React + Babel pinned -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; }
    body {
      font-family: -apple-system, 'SF Pro Text', 'PingFang SC', sans-serif;
      background: #0B0D12;
      color: #F2F3F7;
      -webkit-font-smoothing: antialiased;
    }
    #root { min-height: 100vh; }

    @keyframes bsPulseRing {
      0%   { transform: scale(1); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .bs-live-pulse { position: relative; }
    .bs-live-pulse::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,107,117,0.55);
      animation: bsPulseRing 1.6s ease-out infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // ============================================================
    // 设计假设（Junior pass 先声明，等 manager 反馈）
    // 1. 三种形态共用一套倒计时语言，精度随临近收束：
    //    far(>1天) = 天数 hero；near(<24h) = 时:分:秒；live = 脉冲 + 已进行
    // 2. 锁屏组件尊重 iOS 单色渲染约束：只用白色透明度，不上金色
    // 3. 实时活动 / 灵动岛只在开场前 12 小时内存在（平台限制），
    //    far 状态下锁屏不出现 Live Activity banner —— 这是有意为之
    // 4. 海报图只出现在：中号主屏组件、Live Activity 缩略图
    // 5. 虚构演出数据：「夜航西飞 · 2026 剧场巡演」上海站 8月9日 19:30
    // ============================================================

    const STAGE = {
      background: '#05070D',
      surface: '#0D111B',
      surfaceRaised: '#151A27',
      foreground: '#F2F3F7',
      muted: '#9399AA',
      dim: '#646B7D',
      border: 'rgba(255,255,255,0.09)',
      accent: '#E8C78E',
      live: '#FF6B75',
      liveTitle: '#FFD0D3',
    };

    const POSTER = 'assets/img/concert_stage_lights_crowd_Live_rock_concert_featuring_.jpg';

    const SHOW = {
      name: '夜航西飞',
      tour: '2026 剧场巡演',
      city: '上海',
      venue: '梅赛德斯-奔驰文化中心',
      dateText: '8月9日',
      timeText: '19:30',
      endText: '22:00',
    };

    // 三态：状态栏时间 / 锁屏时钟与倒数值彼此自洽（19:30 开场）
    const WIDGET_STATES = {
      far: {
        key: 'far', label: '距开场 11 天',
        statusTime: '9:41', lockDate: '7月29日 周三', lockTime: '9:41',
        days: '11', subH: '07', subM: '42',
      },
      near: {
        key: 'near', label: '开场当晚 · 还有 3 小时',
        statusTime: '16:05', lockDate: '8月9日 周日', lockTime: '16:05',
        h: '03', m: '24', s: '18',
      },
      live: {
        key: 'live', label: '开场中 · 已进行 47 分钟',
        statusTime: '20:17', lockDate: '8月9日 周日', lockTime: '20:17',
        elapsed: '47:32',
      },
    };

    // ---------- IosFrame（本 skill 标准外壳，禁止手写灵动岛/状态栏） ----------
    const iosFrameStyles = {
      wrapper: {
        display: 'inline-block',
        padding: 12,
        background: '#000',
        borderRadius: 60,
        boxShadow: '0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)',
        position: 'relative',
      },
      screen: { position: 'relative', borderRadius: 48, overflow: 'hidden', background: '#fff' },
      statusBar: {
        position: 'absolute', top: 0, left: 0, right: 0, height: 54,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 32px 0 32px', fontSize: 16, fontWeight: 600, zIndex: 20, pointerEvents: 'none',
      },
      dynamicIsland: {
        position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)',
        width: 124, height: 36, background: '#000', borderRadius: 999, zIndex: 30,
      },
      statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
      signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
      signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
      batteryIcon: {
        width: 26, height: 12, border: '1.5px solid currentColor',
        borderRadius: 3, padding: 1, position: 'relative', opacity: 0.8,
      },
      batteryCap: {
        position: 'absolute', top: 3, right: -3, width: 2, height: 6,
        background: 'currentColor', borderRadius: '0 1px 1px 0',
      },
      content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'hidden' },
      homeIndicator: {
        position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)',
        width: 140, height: 5, background: 'rgba(0,0,0,0.3)', borderRadius: 999, zIndex: 10,
      },
    };

    function IosFrame({ children, width = 393, height = 852, time = '9:41', battery = 100 }) {
      const textColor = '#fff';
      return (
        <div style={iosFrameStyles.wrapper}>
          <div style={{ ...iosFrameStyles.screen, width, height, background: '#000' }}>
            <div style={{ ...iosFrameStyles.statusBar, color: textColor }}>
              <span>{time}</span>
              <div style={iosFrameStyles.statusIcons}>
                <div style={iosFrameStyles.signalIcon}>
                  {[4, 6, 9, 11].map(h => <div key={h} style={{ ...iosFrameStyles.signalBar, height: h }} />)}
                </div>
                <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: textColor }}>
                  <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
                  <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
                  <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
                </svg>
                <div style={iosFrameStyles.batteryIcon}>
                  <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1, opacity: 0.9 }} />
                  <div style={iosFrameStyles.batteryCap} />
                </div>
              </div>
            </div>
            <div style={iosFrameStyles.dynamicIsland} />
            <div style={{ ...iosFrameStyles.content, top: 0, bottom: 0 }}>{children}</div>
            <div style={{ ...iosFrameStyles.homeIndicator, background: 'rgba(255,255,255,0.5)' }} />
          </div>
        </div>
      );
    }

    // ---------- 共用小组件元素 ----------

    function LiveDot({ size = 8 }) {
      return (
        <span className="bs-live-pulse" style={{
          display: 'inline-block', width: size, height: size,
          borderRadius: '50%', background: STAGE.live, flex: 'none',
        }} />
      );
    }

    function WidgetBadge({ text, color }) {
      return (
        <span style={{
          fontSize: 9, fontWeight: 700, letterSpacing: '0.08em',
          color: color, flex: 'none',
        }}>{text}</span>
      );
    }

    // 倒计时小格（app 内 countdownCell 的 widget 版）
    function CountdownCell({ value, unit, digitSize = 22 }) {
      return (
        <div style={{
          flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center',
          gap: 2, padding: '8px 0 7px',
          borderRadius: 10,
          background: 'rgba(242,243,247,0.04)',
          border: '1px solid rgba(242,243,247,0.06)',
        }}>
          <span style={{
            fontSize: digitSize, fontWeight: 600, letterSpacing: '-0.02em',
            fontVariantNumeric: 'tabular-nums', color: STAGE.foreground, lineHeight: 1,
          }}>{value}</span>
          <span style={{ fontSize: 9, color: STAGE.dim }}>{unit}</span>
        </div>
      );
    }

    // ---------- 主屏幕小组件 ----------

    // 小号 170×170：纯文字态。far = 天数 hero，near = hh:mm:ss，live = 脉冲 + 已进行
    function WidgetSmall({ state }) {
      return (
        <div style={{
          width: 170, height: 170, borderRadius: 22, overflow: 'hidden',
          background: `linear-gradient(160deg, ${STAGE.surfaceRaised} 0%, ${STAGE.surface} 70%)`,
          border: `1px solid ${STAGE.border}`,
          padding: '14px 14px 12px',
          display: 'flex', flexDirection: 'column',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <span style={{ fontSize: 10, fontWeight: 500, color: STAGE.muted }}>
              {state.key === 'live' ? '演出进行中' : state.key === 'near' ? '今晚开场' : '距离灯亮还有'}
            </span>
            {state.key === 'live'
              ? <LiveDot size={7} />
              : <WidgetBadge text="COUNTDOWN" color={STAGE.accent} />}
          </div>

          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 2 }}>
            {state.key === 'far' && (
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 5 }}>
                <span style={{
                  fontSize: 56, fontWeight: 600, letterSpacing: '-0.03em', lineHeight: 1,
                  fontVariantNumeric: 'tabular-nums', color: STAGE.accent,
                }}>{state.days}</span>
                <span style={{ fontSize: 15, fontWeight: 500, color: STAGE.muted }}>天</span>
              </div>
            )}
            {state.key === 'near' && (
              <span style={{
                fontSize: 33, fontWeight: 600, letterSpacing: '-0.02em', lineHeight: 1.1,
                fontVariantNumeric: 'tabular-nums', color: STAGE.foreground,
              }}>{state.h}:{state.m}<span style={{ color: STAGE.dim, fontSize: 22 }}>:{state.s}</span></span>
            )}
            {state.key === 'live' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                <span style={{ fontSize: 15, fontWeight: 600, color: STAGE.liveTitle }}>灯光已亮</span>
                <span style={{
                  fontSize: 30, fontWeight: 600, letterSpacing: '-0.02em', lineHeight: 1.1,
                  fontVariantNumeric: 'tabular-nums', color: STAGE.foreground,
                }}>{state.elapsed}</span>
                <span style={{ fontSize: 9, color: STAGE.dim }}>已进行</span>
              </div>
            )}
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
            <span style={{
              fontSize: 12, fontWeight: 600, color: STAGE.foreground,
              whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
            }}>{SHOW.name} · {SHOW.city}站</span>
            <span style={{ fontSize: 10, color: STAGE.dim }}>
              {SHOW.dateText} {SHOW.timeText}
            </span>
          </div>
        </div>
      );
    }

    // 中号 364×170：左信息 + 右海报（海报 = 用户自己添加的演出封面，内容必需）
    function WidgetMedium({ state }) {
      return (
        <div style={{
          width: 364, height: 170, borderRadius: 22, overflow: 'hidden',
          background: STAGE.surface,
          border: `1px solid ${STAGE.border}`,
          display: 'flex', position: 'relative',
        }}>
          <div style={{
            flex: 1, padding: '13px 12px 11px 15px',
            display: 'flex', flexDirection: 'column', minWidth: 0,
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 10, fontWeight: 500, color: STAGE.muted }}>
                {state.key === 'live' ? '演出进行中' : '距离灯亮还有'}
              </span>
              <span style={{ flex: 1 }} />
              {state.key === 'live'
                ? <WidgetBadge text="ON STAGE" color={STAGE.liveTitle} />
                : <WidgetBadge text="COUNTDOWN" color={STAGE.accent} />}
            </div>

            <div style={{ flex: 1, display: 'flex', alignItems: 'center' }}>
              {state.key === 'far' && (
                <div style={{ display: 'flex', alignItems: 'center', width: '100%' }}>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 5 }}>
                    <span style={{
                      fontSize: 44, fontWeight: 600, letterSpacing: '-0.03em', lineHeight: 1,
                      fontVariantNumeric: 'tabular-nums', color: STAGE.accent,
                    }}>{state.days}</span>
                    <span style={{ fontSize: 14, fontWeight: 500, color: STAGE.muted }}>天</span>
                  </div>
                  <span style={{ flex: 1 }} />
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 2 }}>
                    <span style={{
                      fontSize: 17, fontWeight: 600, fontVariantNumeric: 'tabular-nums',
                      color: STAGE.foreground,
                    }}>{state.subH}:{state.subM}</span>
                    <span style={{ fontSize: 9, color: STAGE.dim }}>时 · 分</span>
                  </div>
                </div>
              )}
              {state.key === 'near' && (
                <div style={{ display: 'flex', gap: 6, width: '100%' }}>
                  <CountdownCell value={state.h} unit="时" />
                  <CountdownCell value={state.m} unit="分" />
                  <CountdownCell value={state.s} unit="秒" />
                </div>
              )}
              {state.key === 'live' && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%' }}>
                  <LiveDot size={9} />
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                    <span style={{ fontSize: 15, fontWeight: 600, color: STAGE.liveTitle }}>灯光已亮 · 开场中</span>
                    <span style={{ fontSize: 10, color: STAGE.muted }}>收好票夹与手机电量</span>
                  </div>
                  <span style={{ flex: 1 }} />
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 2 }}>
                    <span style={{
                      fontSize: 17, fontWeight: 600, fontVariantNumeric: 'tabular-nums',
                      color: STAGE.foreground,
                    }}>{state.elapsed}</span>
                    <span style={{ fontSize: 9, color: STAGE.dim }}>已进行</span>
                  </div>
                </div>
              )}
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
              <span style={{
                fontSize: 13, fontWeight: 600, color: STAGE.foreground,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
              }}>{SHOW.name} · {SHOW.tour}</span>
              <span style={{
                fontSize: 10, color: STAGE.dim,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
              }}>{SHOW.dateText} {SHOW.timeText} · {SHOW.venue}</span>
            </div>
          </div>

          {/* 海报：左缘渐隐进卡面，避免硬切 */}
          <div style={{
            width: 108, flex: 'none', position: 'relative',
            backgroundImage: `url(${POSTER})`,
            backgroundSize: 'cover', backgroundPosition: '42% 30%',
          }}>
            <div style={{
              position: 'absolute', inset: 0,
              background: `linear-gradient(90deg, ${STAGE.surface} 0%, rgba(13,17,27,0.55) 45%, rgba(13,17,27,0.15) 100%)`,
            }} />
          </div>
        </div>
      );
    }

    // ---------- 锁屏组件（iOS 单色约束：只用白色透明度） ----------

    const LOCK_INK = 'rgba(255,255,255,0.92)';
    const LOCK_INK_DIM = 'rgba(255,255,255,0.55)';

    // 时钟上方 inline（纯文本 + 符号，平台只给一行）
    function LockInline({ state }) {
      const text = state.key === 'live'
        ? `开场中 · 已进行 ${state.elapsed}`
        : state.key === 'near'
          ? `今晚 19:30 灯亮 · 还有 ${parseInt(state.h, 10)} 小时`
          : `${state.days} 天后灯亮 · ${SHOW.name}`;
      return (
        <div style={{
          display: 'inline-flex', alignItems: 'center', gap: 5,
          fontSize: 15, fontWeight: 600, color: LOCK_INK,
        }}>
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
            <path d="M7 1v4M7 5L3 13h8L7 5z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round" strokeLinecap="round" />
          </svg>
          {text}
        </div>
      );
    }

    // 圆形：进度环（从「添加演出」到「灯亮」消耗）+ 中心值
    function LockCircular({ state }) {
      const progress = state.key === 'far' ? 0.62 : state.key === 'near' ? 0.92 : 1;
      const R = 24, C = 2 * Math.PI * R;
      return (
        <div style={{ width: 56, height: 56, position: 'relative' }}>
          <svg width="56" height="56" viewBox="0 0 56 56">
            <circle cx="28" cy="28" r={R} fill="none" stroke="rgba(255,255,255,0.22)" strokeWidth="4" />
            <circle
              cx="28" cy="28" r={R} fill="none"
              stroke={LOCK_INK} strokeWidth="4" strokeLinecap="round"
              strokeDasharray={`${C * progress} ${C}`}
              transform="rotate(-90 28 28)"
            />
          </svg>
          <div style={{
            position: 'absolute', inset: 0,
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
          }}>
            {state.key === 'live' ? (
              <React.Fragment>
                <span style={{ width: 6, height: 6, borderRadius: '50%', background: LOCK_INK }} />
                <span style={{ fontSize: 10, fontWeight: 700, color: LOCK_INK, fontVariantNumeric: 'tabular-nums', marginTop: 2 }}>{state.elapsed}</span>
              </React.Fragment>
            ) : state.key === 'near' ? (
              <React.Fragment>
                <span style={{ fontSize: 14, fontWeight: 700, color: LOCK_INK, fontVariantNumeric: 'tabular-nums', lineHeight: 1 }}>{parseInt(state.h, 10)}:{state.m}</span>
                <span style={{ fontSize: 7, color: LOCK_INK_DIM, marginTop: 1 }}>后灯亮</span>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <span style={{ fontSize: 16, fontWeight: 700, color: LOCK_INK, fontVariantNumeric: 'tabular-nums', lineHeight: 1 }}>{state.days}</span>
                <span style={{ fontSize: 8, color: LOCK_INK_DIM, marginTop: 1 }}>天</span>
              </React.Fragment>
            )}
          </div>
        </div>
      );
    }

    // 长条形（时钟下方）：两行，主值 + 场次信息
    function LockRect({ state }) {
      return (
        <div style={{
          width: 178, borderRadius: 14,
          background: 'rgba(255,255,255,0.10)',
          padding: '7px 11px',
          display: 'flex', flexDirection: 'column', gap: 1,
        }}>
          <span style={{
            fontSize: 12, fontWeight: 700, color: LOCK_INK,
            fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap',
          }}>
            {state.key === 'live'
              ? `LIVE · 已进行 ${state.elapsed}`
              : state.key === 'near'
                ? `距灯亮 ${state.h}:${state.m}:${state.s}`
                : `距灯亮还有 ${state.days} 天`}
          </span>
          <span style={{
            fontSize: 10, color: LOCK_INK_DIM,
            whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
          }}>
            {SHOW.name} · {SHOW.dateText} {SHOW.timeText}
          </span>
        </div>
      );
    }

    // ---------- Live Activity（锁屏 banner） ----------

    function LiveActivityBanner({ state }) {
      if (state.key === 'far') return null; // 平台限制：提前 12 小时才启动
      const isLive = state.key === 'live';
      return (
        <div style={{
          borderRadius: 24,
          background: 'rgba(10,12,18,0.86)',
          backdropFilter: 'blur(20px)',
          border: '1px solid rgba(255,255,255,0.10)',
          padding: '12px 14px',
          display: 'flex', flexDirection: 'column', gap: 10,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{
              width: 40, height: 40, borderRadius: 10, flex: 'none',
              backgroundImage: `url(${POSTER})`,
              backgroundSize: 'cover', backgroundPosition: '42% 30%',
              border: '1px solid rgba(255,255,255,0.12)',
            }} />
            <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 1 }}>
              <span style={{
                fontSize: 13, fontWeight: 600, color: STAGE.foreground,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
              }}>{SHOW.name} · {SHOW.city}站</span>
              <span style={{ fontSize: 11, color: isLive ? STAGE.liveTitle : STAGE.accent, display: 'flex', alignItems: 'center', gap: 5 }}>
                {isLive && <LiveDot size={6} />}
                {isLive ? 'LIVE · 开场中' : '即将灯亮'}
              </span>
            </div>
            <span style={{
              fontSize: 20, fontWeight: 600, fontVariantNumeric: 'tabular-nums',
              color: isLive ? STAGE.liveTitle : STAGE.accent, letterSpacing: '-0.02em',
            }}>
              {isLive ? state.elapsed : `${state.h}:${state.m}:${state.s}`}
            </span>
          </div>
          {isLive && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
              <div style={{ height: 3, borderRadius: 2, background: 'rgba(255,255,255,0.12)', position: 'relative' }}>
                <div style={{
                  position: 'absolute', left: 0, top: 0, bottom: 0, width: '32%',
                  borderRadius: 2, background: STAGE.live,
                }} />
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: STAGE.dim, fontVariantNumeric: 'tabular-nums' }}>
                <span>{SHOW.timeText} 开场</span>
                <span>预计 {SHOW.endText} 谢幕</span>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ---------- 灵动岛 ----------

    // 紧凑态：岛向两侧延展，左图标 + 右计时
    function IslandCompact({ state }) {
      const isLive = state.key === 'live';
      return (
        <div style={{
          height: 36, borderRadius: 999, background: '#000',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '0 12px', width: 250,
          border: '1px solid rgba(255,255,255,0.07)',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            {isLive
              ? <LiveDot size={7} />
              : <span style={{ width: 7, height: 7, borderRadius: '50%', background: STAGE.accent }} />}
            <span style={{ fontSize: 11, fontWeight: 600, color: isLive ? STAGE.liveTitle : STAGE.accent }}>
              {isLive ? 'LIVE' : '开场前'}
            </span>
          </div>
          <span style={{
            fontSize: 12, fontWeight: 600, fontVariantNumeric: 'tabular-nums', color: STAGE.foreground,
          }}>
            {isLive ? state.elapsed : `${state.h}:${state.m}:${state.s}`}
          </span>
        </div>
      );
    }

    // 展开态：长按岛后的大卡
    function IslandExpanded({ state }) {
      const isLive = state.key === 'live';
      return (
        <div style={{
          width: 364, borderRadius: 40, background: '#000',
          border: '1px solid rgba(255,255,255,0.08)',
          padding: '14px 18px 15px',
          display: 'flex', flexDirection: 'column', gap: 12,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div style={{
              width: 26, height: 26, borderRadius: 7, flex: 'none',
              backgroundImage: `url(${POSTER})`,
              backgroundSize: 'cover', backgroundPosition: '42% 30%',
              border: '1px solid rgba(255,255,255,0.12)',
            }} />
            <span style={{
              flex: 1, fontSize: 13, fontWeight: 600, color: STAGE.foreground,
              whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
            }}>{SHOW.name} · {SHOW.city}站</span>
            <span style={{
              fontSize: 16, fontWeight: 600, fontVariantNumeric: 'tabular-nums',
              color: isLive ? STAGE.liveTitle : STAGE.accent,
              display: 'flex', alignItems: 'center', gap: 6,
            }}>
              {isLive && <LiveDot size={7} />}
              {isLive ? state.elapsed : `${state.h}:${state.m}:${state.s}`}
            </span>
          </div>
          <div style={{ height: 1, background: 'rgba(255,255,255,0.08)' }} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 2 }}>
              <span style={{ fontSize: 11, color: STAGE.muted }}>
                {isLive ? '灯光已亮 · 开场中' : '距离灯亮还有'}
              </span>
              <span style={{ fontSize: 11, color: STAGE.dim }}>
                {SHOW.dateText} {SHOW.timeText} · {SHOW.venue}
              </span>
            </div>
            {!isLive && (
              <div style={{ display: 'flex', gap: 5 }}>
                <CountdownCell value={state.h} unit="时" digitSize={17} />
                <CountdownCell value={state.m} unit="分" digitSize={17} />
                <CountdownCell value={state.s} unit="秒" digitSize={17} />
              </div>
            )}
            {isLive && (
              <span style={{ fontSize: 11, color: STAGE.dim }}>预计 {SHOW.endText} 谢幕</span>
            )}
          </div>
        </div>
      );
    }

    // ---------- 主屏幕 / 锁屏整机 ----------

    function AppIcon({ glyph, tint }) {
      return (
        <div style={{
          width: 60, height: 60, borderRadius: 14,
          background: tint || 'rgba(255,255,255,0.10)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: 'rgba(255,255,255,0.75)',
        }}>{glyph}</div>
      );
    }

    const glyphCamera = (
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
        <rect x="3" y="7" width="18" height="13" rx="3" />
        <circle cx="12" cy="13.5" r="3.6" />
        <path d="M8.5 7l1.4-2.4h4.2L15.5 7" />
      </svg>
    );
    const glyphChat = (
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
        <path d="M4 6.5A3.5 3.5 0 017.5 3h9A3.5 3.5 0 0120 6.5v6a3.5 3.5 0 01-3.5 3.5H12l-5 4.5v-4.5A3.5 3.5 0 014 12.5v-6z" strokeLinejoin="round" />
      </svg>
    );
    const glyphGear = (
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
        <circle cx="12" cy="12" r="3.2" />
        <path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" />
      </svg>
    );
    const glyphNote = (
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
        <path d="M9 18.5V6l10-2.5V16" strokeLinejoin="round" />
        <circle cx="6.5" cy="18.5" r="2.5" />
        <circle cx="16.5" cy="16" r="2.5" />
      </svg>
    );
    const glyphPhoto = (
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
        <rect x="3.5" y="3.5" width="17" height="17" rx="4" />
        <circle cx="9" cy="9.5" r="1.8" />
        <path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5" strokeLinejoin="round" />
      </svg>
    );
    const glyphMap = (
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
        <path d="M12 21s-6.5-5.4-6.5-10A6.5 6.5 0 0112 4.5 6.5 6.5 0 0118.5 11c0 4.6-6.5 10-6.5 10z" strokeLinejoin="round" />
        <circle cx="12" cy="11" r="2.2" />
      </svg>
    );
    const glyphMail = (
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
        <rect x="3" y="5.5" width="18" height="13" rx="3" />
        <path d="M4 7.5l8 6 8-6" />
      </svg>
    );
    const glyphSafari = (
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M15.5 8.5l-2 5-5 2 2-5 5-2z" strokeLinejoin="round" />
      </svg>
    );

    function HomeScreen({ state }) {
      return (
        <div style={{ position: 'absolute', inset: 0 }}>
          {/* 壁纸：舞台底 + 底部钨丝金光晕 */}
          <div style={{
            position: 'absolute', inset: 0,
            background: `radial-gradient(120% 55% at 50% 108%, rgba(232,199,142,0.16) 0%, rgba(232,199,142,0.05) 38%, transparent 62%), linear-gradient(180deg, #070A12 0%, ${STAGE.background} 55%, #03040A 100%)`,
          }} />
          <div style={{
            position: 'relative', padding: '64px 15px 0',
            display: 'flex', flexDirection: 'column', gap: 13,
          }}>
            <WidgetMedium state={state} />
            <div style={{ display: 'flex', gap: 13 }}>
              <WidgetSmall state={state} />
              <div style={{ display: 'flex', gap: 13 }}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 13 }}>
                  <AppIcon glyph={glyphCamera} tint="rgba(120,132,158,0.28)" />
                  <AppIcon glyph={glyphPhoto} tint="rgba(150,128,96,0.24)" />
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 13 }}>
                  <AppIcon glyph={glyphChat} tint="rgba(96,140,116,0.26)" />
                  <AppIcon glyph={glyphNote} tint="rgba(120,110,150,0.26)" />
                </div>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 13 }}>
              <AppIcon glyph={glyphGear} tint="rgba(255,255,255,0.10)" />
              <AppIcon glyph={glyphMap} tint="rgba(100,124,150,0.24)" />
              <AppIcon glyph={glyphMail} tint="rgba(255,255,255,0.10)" />
              <AppIcon glyph={glyphSafari} tint="rgba(255,255,255,0.10)" />
            </div>
          </div>
          {/* Dock */}
          <div style={{
            position: 'absolute', left: 15, right: 15, bottom: 26,
            height: 86, borderRadius: 26,
            background: 'rgba(255,255,255,0.08)',
            backdropFilter: 'blur(18px)',
            display: 'flex', alignItems: 'center', justifyContent: 'space-evenly',
          }}>
            <AppIcon glyph={glyphChat} tint="rgba(96,140,116,0.30)" />
            <AppIcon glyph={glyphSafari} tint="rgba(100,124,150,0.30)" />
            <AppIcon glyph={glyphNote} tint="rgba(150,128,96,0.28)" />
            <AppIcon glyph={glyphCamera} tint="rgba(255,255,255,0.12)" />
          </div>
        </div>
      );
    }

    function LockScreen({ state }) {
      return (
        <div style={{ position: 'absolute', inset: 0 }}>
          {/* 壁纸：本场海报压暗——锁屏即舞台 */}
          <div style={{
            position: 'absolute', inset: -20,
            backgroundImage: `url(${POSTER})`,
            backgroundSize: 'cover', backgroundPosition: '42% 30%',
            filter: 'blur(22px) brightness(0.30) saturate(0.9)',
          }} />
          <div style={{
            position: 'absolute', inset: 0,
            background: 'linear-gradient(180deg, rgba(5,7,13,0.30) 0%, rgba(5,7,13,0.55) 55%, rgba(5,7,13,0.78) 100%)',
          }} />

          <div style={{
            position: 'relative', paddingTop: 62,
            display: 'flex', flexDirection: 'column', alignItems: 'center',
          }}>
            <LockInline state={state} />
            <span style={{ fontSize: 15, fontWeight: 500, color: LOCK_INK_DIM, marginTop: 6 }}>
              {state.lockDate}
            </span>
            <span style={{
              fontSize: 92, fontWeight: 200, lineHeight: 1.06, color: LOCK_INK,
              fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.01em',
            }}>{state.lockTime}</span>

            <div style={{ display: 'flex', gap: 10, marginTop: 14, alignItems: 'center' }}>
              <LockCircular state={state} />
              <LockRect state={state} />
            </div>
          </div>

          {/* Live Activity：near/live 才存在（提前 12h 启动） */}
          <div style={{ position: 'absolute', left: 12, right: 12, bottom: 96 }}>
            <LiveActivityBanner state={state} />
          </div>

          {/* 底部快捷按钮 */}
          <div style={{
            position: 'absolute', left: 0, right: 0, bottom: 34,
            display: 'flex', justifyContent: 'space-between', padding: '0 42px',
          }}>
            {['M6 2v20M6 12l8 8M6 12l8-8', ''].map((d, i) => (
              <div key={i} style={{
                width: 46, height: 46, borderRadius: '50%',
                background: 'rgba(0,0,0,0.45)', backdropFilter: 'blur(10px)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                color: 'rgba(255,255,255,0.85)',
              }}>
                {i === 0 ? (
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                    <rect x="8.5" y="3" width="7" height="3.4" rx="1.2" />
                    <path d="M9.3 6.4L8 20.5h8l-1.3-14.1" strokeLinejoin="round" />
                  </svg>
                ) : (
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                    <path d="M9 4.5L7.8 6.5H6A2.5 2.5 0 003.5 9v8A2.5 2.5 0 006 19.5h12a2.5 2.5 0 002.5-2.5V9A2.5 2.5 0 0018 6.5h-1.8L15 4.5H9z" strokeLinejoin="round" />
                    <circle cx="12" cy="12.8" r="3.4" />
                  </svg>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ---------- 页面 ----------

    const pageStyles = {
      board: { padding: '56px 48px 64px', maxWidth: 1560, margin: '0 auto' },
      boardHeader: { marginBottom: 40, display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', flexWrap: 'wrap', gap: 20 },
      sectionLabel: {
        fontSize: 12, fontWeight: 600, letterSpacing: '0.14em',
        color: STAGE.dim, textTransform: 'uppercase', marginBottom: 16,
      },
      phoneLabel: { fontSize: 13, color: '#666E80', marginBottom: 12, fontStyle: 'italic' },
    };

    function StateSwitcher({ active, onChange }) {
      return (
        <div style={{
          display: 'inline-flex', gap: 4, padding: 4,
          borderRadius: 999, background: 'rgba(255,255,255,0.05)',
          border: '1px solid rgba(255,255,255,0.08)',
        }}>
          {Object.values(WIDGET_STATES).map(s => (
            <button key={s.key} onClick={() => onChange(s.key)} style={{
              border: 'none', cursor: 'pointer',
              padding: '8px 16px', borderRadius: 999,
              fontSize: 13, fontWeight: active === s.key ? 600 : 500,
              fontFamily: 'inherit',
              color: active === s.key ? '#0B0D12' : STAGE.muted,
              background: active === s.key ? STAGE.accent : 'transparent',
              transition: 'all 0.18s ease',
            }}>{s.label}</button>
          ))}
        </div>
      );
    }

    function SpecNote({ title, children }) {
      return (
        <div style={{
          padding: '14px 16px', borderRadius: 14,
          background: 'rgba(255,255,255,0.03)',
          border: '1px solid rgba(255,255,255,0.07)',
          display: 'flex', flexDirection: 'column', gap: 6,
        }}>
          <span style={{ fontSize: 12, fontWeight: 700, color: STAGE.accent }}>{title}</span>
          <span style={{ fontSize: 12, lineHeight: 1.7, color: STAGE.muted }}>{children}</span>
        </div>
      );
    }

    function App() {
      const [stateKey, setStateKey] = useState('far');
      const state = WIDGET_STATES[stateKey];

      return (
        <div style={pageStyles.board}>
          <div style={pageStyles.boardHeader}>
            <div>
              <div style={{
                fontSize: 12, fontWeight: 600, letterSpacing: '0.16em',
                color: STAGE.accent, marginBottom: 10,
              }}>BEFORESHOW · WIDGET SYSTEM</div>
              <h1 style={{ fontSize: 34, fontWeight: 700, letterSpacing: '-0.02em' }}>
                开场前 · 小组件设计稿
              </h1>
              <p style={{ fontSize: 14, color: STAGE.muted, marginTop: 8 }}>
                主屏幕 / 锁屏 / 灵动岛，一套倒计时语言：精度随临近收束，灯亮后切换为「已进行」。
              </p>
            </div>
            <StateSwitcher active={stateKey} onChange={setStateKey} />
          </div>

          <div style={{ display: 'flex', gap: 44, flexWrap: 'wrap', alignItems: 'flex-start' }}>
            <div>
              <div style={pageStyles.phoneLabel}>主屏幕 · 中号 364×170 + 小号 170×170</div>
              <IosFrame time={state.statusTime} battery={72}>
                <HomeScreen state={state} />
              </IosFrame>
            </div>

            <div>
              <div style={pageStyles.phoneLabel}>锁屏 · inline + 圆形 + 长条 + 实时活动</div>
              <IosFrame time="" battery={72}>
                <LockScreen state={state} />
              </IosFrame>
            </div>

            <div style={{ width: 400 }}>
              <div style={pageStyles.phoneLabel}>灵动岛 · 紧凑态与展开态</div>
              <div style={{
                borderRadius: 28, padding: '26px 18px',
                background: 'linear-gradient(180deg, #10131C 0%, #0A0C12 100%)',
                border: '1px solid rgba(255,255,255,0.07)',
                display: 'flex', flexDirection: 'column', gap: 22, alignItems: 'center',
              }}>
                {state.key === 'far' ? (
                  <div style={{
                    padding: '40px 20px', textAlign: 'center',
                    fontSize: 12, color: STAGE.dim, lineHeight: 1.8,
                  }}>
                    距开场超过 12 小时<br />实时活动尚未启动，灵动岛休息
                  </div>
                ) : (
                  <React.Fragment>
                    <IslandCompact state={state} />
                    <IslandExpanded state={state} />
                  </React.Fragment>
                )}
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 22 }}>
                <SpecNote title="精度收束">
                  与 App 首页同一套逻辑：&gt;1 天只到天（hero）+ 时:分；&lt;24h 秒开始跳；灯亮后切「已进行」。小号组件放不下三格，near 态用单行 hh:mm:ss。
                </SpecNote>
                <SpecNote title="锁屏单色约束">
                  iOS 锁屏组件强制单色渲染，金色只留在主屏组件与实时活动里；锁屏用白色透明度分级。
                </SpecNote>
                <SpecNote title="实时活动生命周期">
                  提前 12 小时启动（平台上限），所以 far 态锁屏没有 banner；灯亮后进度条指向预计谢幕（endTime）。
                </SpecNote>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
