<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>3. 倒数1天 · 室内外温差 (许钧巡演 · 寒夜靛蓝天幕 + 舞台电声紫光)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root {
  --stage-background: #070709;
  --stage-surface: #111114;
  --stage-surface-raised: #18181C;
  --stage-foreground: #F4F4F6;
  --stage-muted: #96969E;
  --stage-dim: #5C5C64;
  --stage-border: rgba(255, 255, 255, 0.09);
  --stage-accent: #E8C78E;
  --stage-hero-ivory: #F5EFE2;
  --stage-violet: #7B678F;
  --radius-card: 20px;
}
body {
  margin: 0;
  padding: 0;
  background: #000000;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
* {
  box-sizing: border-box;
}
.device-shell {
  width: 390px;
  height: 844px;
  background: #070709;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  color: var(--stage-foreground);
}

/* ══════════════════════════════════════════════════════════════
   方案 1 空间分层：
   层级 ①：最底层全屏晴冷冬夜寒空天幕 (Far Cold Sky)
   层级 ②：海报正后方室内电声紫光晕 (Near Stage Violet Bloom)
   冷暖交织，外冷内热
   ══════════════════════════════════════════════════════════════ */
.stage-weather-sky {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
  background: linear-gradient(180deg,
    #14162E 0%,
    #101124 24%,
    #0E0C1C 50%,
    #090812 75%,
    #070709 100%
  );
}
.night-cold-glow {
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  width: 440px;
  height: 360px;
  background: radial-gradient(ellipse at 50% 35%,
    rgba(138, 155, 189, 0.32) 0%,
    rgba(82, 98, 138, 0.16) 45%,
    transparent 80%
  );
  filter: blur(52px);
  mix-blend-mode: screen;
}

/* 层级 ②：海报背后的室内电声紫舞台背光 (Near Bloom) */
.poster-cover-bloom {
  position: absolute;
  top: 130px;
  left: 50%;
  transform: translateX(-50%);
  width: 310px;
  height: 400px;
  border-radius: 40px;
  background: radial-gradient(ellipse at 50% 48%,
    rgba(123, 103, 143, 0.70) 0%,
    rgba(167, 139, 195, 0.32) 45%,
    rgba(123, 103, 143, 0.08) 70%,
    transparent 85%
  );
  filter: blur(44px);
  mix-blend-mode: screen;
  pointer-events: none;
  z-index: 2;
}

/* Device Chrome */
.status-bar {
  height: 44px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.2px;
  z-index: 30;
  flex-shrink: 0;
}
.dynamic-island {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 32px;
  background: #000000;
  border-radius: 20px;
  z-index: 40;
}
.home-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: rgba(255, 255, 255, 0.28);
  border-radius: 3px;
  z-index: 40;
}

/* CurrentShowHomeHeader: "当前" 32pt bold + 天气 Icon Button */
.top-header {
  height: 52px;
  padding: 4px 20px 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 20;
  flex-shrink: 0;
}
.header-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.title-current {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: #FFFFFF;
  line-height: 1;
}
.weather-header-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(138, 155, 189, 0.18);
  border: 1px solid rgba(138, 155, 189, 0.38);
  border-radius: 20px;
  padding: 4px 10px 4px 8px;
  color: #D3DBEB;
  cursor: pointer;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.weather-btn-icon {
  width: 14px;
  height: 14px;
  color: #BAC7DE;
  flex-shrink: 0;
}
.weather-btn-text {
  font-size: 12px;
  font-weight: 600;
}
.weather-btn-chevron {
  width: 10px;
  height: 10px;
  color: rgba(211, 219, 235, 0.7);
}

.chrome-icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.16);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--stage-foreground);
  cursor: pointer;
  backdrop-filter: blur(12px);
}

/* Scrollable Stage Content */
.scroll-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px 20px 96px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  z-index: 10;
  scrollbar-width: none;
}
.scroll-content::-webkit-scrollbar {
  display: none;
}

/* 1. HomeHeroStage: 3:4 Poster */
.home-hero-stage {
  align-self: center;
  width: 248px;
  height: 330px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hero-poster-card {
  width: 100%;
  height: 100%;
  border-radius: 26px;
  background: linear-gradient(145deg, #1C172E 0%, #0D0A16 100%);
  border: 1px solid rgba(123, 103, 143, 0.38);
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.75);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 18px 16px;
}
.hero-poster-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at 80% 25%, rgba(123, 103, 143, 0.4) 0%, transparent 75%);
  pointer-events: none;
}
.poster-art-title {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.5px;
  line-height: 1.1;
  color: #FFFFFF;
}
.poster-lineup-preview {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.8);
  line-height: 1.4;
}

/* 2. HomeCountdownCard */
.countdown-card {
  background: rgba(17, 17, 20, 0.88);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.11);
  border-radius: var(--radius-card);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
}
.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(123, 103, 143, 0.22);
  font-size: 11px;
  font-weight: 600;
  color: #D6C7E8;
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 3px;
  background: #B69CD4;
}
.mode-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--stage-muted);
}
.show-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--stage-foreground);
  line-height: 1.25;
}
.identity-details {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--stage-muted);
  margin-top: 3px;
}
.countdown-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 4px 0 2px 0;
}
.countdown-day {
  font-size: 72px;
  font-weight: 200;
  line-height: 0.94;
  color: var(--stage-hero-ivory);
  letter-spacing: -1.5px;
}
.countdown-unit {
  font-size: 20px;
  font-weight: 400;
  color: var(--stage-dim);
}
.btn-primary-action {
  height: 44px;
  border-radius: 12px;
  background: var(--stage-accent);
  border: none;
  color: #070709;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* Bottom Tab Bar */
.tab-bar {
  height: 78px;
  background: rgba(9, 11, 18, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--stage-border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 10px 14px 10px;
  z-index: 30;
  flex-shrink: 0;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--stage-dim);
  font-size: 10px;
  font-weight: 500;
}
.tab-item.active {
  color: var(--stage-accent);
}
</style>
</helmet>

<div class="device-shell">
  <!-- 层级 ①：全屏晴冷冬夜寒空天幕 -->
  <div class="stage-weather-sky">
    <div class="night-cold-glow"></div>
  </div>

  <!-- 层级 ②：海报背后室内电声紫舞台背光 -->
  <div class="poster-cover-bloom"></div>

  <div class="dynamic-island"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span>09:41</span>
    <div style="display: flex; align-items: center; gap: 6px;">
      <svg width="15" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
        <path d="M1 9.5C3.5 6.5 8 6.5 10.5 9.5M3 7C5 4.5 8.5 4.5 10.5 7M6 4C7 3 8.5 3 9.5 4M8 1.5C8 1.2 8.2 1 8.5 1C8.8 1 9 1.2 9 1.5Z" stroke="#F4F4F6" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <div style="width: 22px; height: 11px; border: 1px solid #F4F4F6; border-radius: 3px; padding: 1px; display: flex; align-items: center;">
        <div style="width: 15px; height: 7px; background: #F4F4F6; border-radius: 1.5px;"></div>
      </div>
    </div>
  </div>

  <!-- CurrentShowHomeHeader: "当前" 32pt bold + 天气 Icon Button -->
  <div class="top-header">
    <div class="header-title-row">
      <span class="title-current">当前</span>
      <button class="weather-header-btn" type="button" aria-label="查看天气详情">

      </button>
    </div>
    <button class="chrome-icon-btn" type="button" aria-label="演出列表">

        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Scrollable Stage Content -->
  <div class="scroll-content">
    <!-- HomeHeroStage: 3:4 Poster -->
    <div class="home-hero-stage">
      <div class="hero-poster-card">
        <div>
          <div style="font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--stage-violet); margin-bottom: 4px;">TOUR POSTER</div>
          <div class="poster-art-title">许钧<br>我“爱”世界</div>
        </div>
        <div>
          <div class="poster-lineup-preview">CH8-LIVEHOUSE (小河店)<br>杭州站 · 11月13日</div>
        </div>
      </div>
    </div>

    <!-- HomeCountdownCard -->
    <div class="countdown-card">
      <div class="status-row">
        <div class="status-pill">
          <span class="status-dot"></span>
          <span>开场前</span>
        </div>
        <div class="mode-label">COUNTDOWN</div>
      </div>

      <div>
        <div class="show-title">许钧「我“爱”世界」巡演 · 杭州</div>
        <div class="identity-details">
          <span>11月13日 周五 20:00</span>
          <span>·</span>
          <span>CH8-LIVEHOUSE 小河店</span>
        </div>
      </div>

      <div class="countdown-row">
        <span class="countdown-day">1</span>
        <span class="countdown-unit">天</span>
      </div>

      <button class="btn-primary-action" type="button">
        <span>看路线</span>
      </button>
    </div>
  </div>

  <!-- Bottom Root Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>

      </svg>
      <span>演出</span>

    <div class="tab-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span>足迹</span>
    </div>
  </div>

  <div class="home-bar"></div>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"daysRemaining":{"editor":"int","default":1}}'>

}
</script>
