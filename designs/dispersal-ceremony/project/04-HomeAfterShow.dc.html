<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>散场收束 · 停留期首页（App 现状）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body {
  margin: 0;
  padding: 0;
  background: #000000;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
* {
  box-sizing: border-box;
}
.device-shell {
  width: 390px;
  height: 844px;
  background: #05070D;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  color: #F2F3F7;
}
/* Device Chrome */
.status-bar {
  height: 48px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.2px;
  z-index: 20;
}
.dynamic-island {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 32px;
  background: #000000;
  border-radius: 20px;
  z-index: 30;
}
.home-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: rgba(255, 255, 255, 0.28);
  border-radius: 3px;
  z-index: 20;
}
/* App Header: Shipped CurrentShowHomeHeader */
.app-header {
  height: 52px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 15;
}
.header-title-large {
  font-size: 32px;
  font-weight: 700;
  color: #F2F3F7;
  letter-spacing: -0.5px;
}
.header-action-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-circle-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #F2F3F7;
  cursor: pointer;
}
/* Ambient Lighting from Poster */
.ambient-stage-glow {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: 330px;
  height: 330px;
  background: radial-gradient(circle, rgba(232, 199, 142, 0.2) 0%, rgba(82, 127, 201, 0.12) 45%, transparent 70%);
  filter: blur(48px);
  pointer-events: none;
  z-index: 1;
}
/* Scrollable Home Page */
.home-scroll-view {
  flex: 1;
  overflow-y: auto;
  padding: 4px 20px 96px 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  z-index: 5;
}
/* Shipped HomeHeroStage: 3:4 Poster */
.hero-stage-center {
  display: flex;
  justify-content: center;
  margin-top: 6px;
}
.poster-3x4-frame {
  width: 256px;
  height: 341px;
  border-radius: 20px;
  background: linear-gradient(160deg, #1A1F2C 0%, #0D111B 100%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), 0 0 24px rgba(232, 199, 142, 0.12);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 18px;
}
.poster-artwork {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 65% 30%, rgba(255, 107, 117, 0.38) 0%, rgba(82, 127, 201, 0.28) 45%, rgba(13, 17, 27, 0.98) 100%);
  z-index: 1;
}
.poster-scrim-bottom {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(5, 7, 13, 0.85) 100%);
  z-index: 2;
}
.poster-serial-tag {
  position: relative;
  z-index: 3;
  font-size: 10px;
  font-weight: 700;
  color: #E8C78E;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.poster-meta-title-block {
  position: relative;
  z-index: 3;
}
.poster-artist-heading {
  font-size: 20px;
  font-weight: 700;
  color: #FFFFFF;
  letter-spacing: -0.3px;
  line-height: 1.25;
}
.poster-venue-sub {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.72);
  margin-top: 3px;
}
/* Shipped CurrentShowCountdownCard / HomeCountdownLockup */
.countdown-card-shipped {
  background: #111114;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.09);
  padding: 14px 16px 14px 16px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.card-top-wash {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 55%;
  background: linear-gradient(180deg, rgba(232, 199, 142, 0.07) 0%, transparent 100%);
  pointer-events: none;
}
.card-status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  position: relative;
  z-index: 2;
}
.card-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 9px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.11);
  font-size: 10.5px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 0.65px;
}
.status-pill-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
}
.card-mode-label {
  font-size: 9.5px;
  font-weight: 600;
  color: #5C5C64;
  letter-spacing: 1.45px;
}
.card-identity-name {
  font-size: 22px;
  font-weight: 600;
  color: #F2F3F7;
  letter-spacing: -0.45px;
  line-height: 1.25;
  position: relative;
  z-index: 2;
}
.card-identity-venue {
  font-size: 12.5px;
  color: #9399AA;
  margin-top: 5px;
  position: relative;
  z-index: 2;
}
/* Shipped endedStatus: "这一场结束了" */
.ended-status-block {
  margin-top: 10px;
  position: relative;
  z-index: 2;
}
.ended-hero-text {
  font-size: 44px;
  font-weight: 300;
  color: #F2F3F7;
  letter-spacing: 1px;
  line-height: 1.1;
}
/* Shipped Primary Action Button */
.card-primary-action-btn {
  margin-top: 10px;
  width: 100%;
  padding: 12px 0;
  border-radius: 14px;
  background: rgba(232, 199, 142, 0.1);
  border: 1px solid rgba(232, 199, 142, 0.32);
  color: #E8C78E;
  font-size: 13.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  z-index: 2;
}
/* Shipped Quick Action Row */
.quick-action-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: -2px;
}
.quick-action-tile {
  min-height: 72px;
  border-radius: 16px;
  background: rgba(17, 17, 20, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.09);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: #F2F3F7;
  cursor: pointer;
}
.action-icon {
  color: #E8C78E;
  display: flex;
  align-items: center;
  justify-content: center;
}
.action-label {
  font-size: 12px;
  font-weight: 600;
  color: #F2F3F7;
}
/* Shipped Follow-Up Shows Summary Tile */
.followup-tile {
  border-radius: 16px;
  background: rgba(17, 17, 20, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.followup-left {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.followup-badge {
  font-size: 11px;
  font-weight: 600;
  color: #E8C78E;
}
.followup-name {
  font-size: 14px;
  font-weight: 600;
  color: #F2F3F7;
}
.followup-meta {
  font-size: 11.5px;
  color: #9399AA;
}
.followup-right {
  font-size: 13px;
  font-weight: 600;
  color: #E8C78E;
  display: flex;
  align-items: center;
  gap: 4px;
}
/* Shipped Root Bottom Chrome (bsRootBottomChrome: 3 detached Liquid Glass controls) */
.bottom-glass-nav {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 14px;
  z-index: 25;
}
.nav-tab-capsule {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  background: rgba(21, 26, 39, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 28px;
  backdrop-filter: blur(24px);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
  color: #E8C78E;
  font-size: 13px;
  font-weight: 600;
}
.nav-tab-circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(21, 26, 39, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.14);
  backdrop-filter: blur(24px);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #9399AA;
}
</style>
</helmet>
