name: BeforeShow

# PostHog is declared here (not via Xcode's package UI). The .xcodeproj is
# generated from this file — any edits to project.pbxproj are wiped by the
# next `xcodegen generate`. Always declare packages here instead.
# Check https://github.com/PostHog/posthog-ios/releases for the latest version.
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.64.1
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.40.0

options:
  bundleIdPrefix: com.doublewaterapps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 6.0
    DEVELOPMENT_LANGUAGE: zh-Hans
    DEVELOPMENT_TEAM: 29C8MS76CZ
    CODE_SIGN_STYLE: Automatic
targets:
  BeforeShow:
    type: application
    platform: iOS
    sources:
      - path: BeforeShow
      - path: Shared
    resources:
      - path: BeforeShow/Resources
    dependencies:
      - target: BeforeShowWidgets
        embed: true
      - package: PostHog
      - package: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doublewaterapps.beforeshow
        PRODUCT_NAME: BeforeShow
        INFOPLIST_FILE: BeforeShow/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: BeforeShow/BeforeShow.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        UILAUNCHSTORYBOARDNAME: LaunchScreen
        ENABLE_USER_SCRIPT_SANDBOXING: true
        # PostHog configuration — read from Info.plist at runtime via Bundle.main.
        # Keep in sync with the PostHogAPIKey / PostHogHost entries in Info.plist.
        POSTHOG_API_KEY: phc_zLnN7zxFf2zTS5XkNd9um5DgNPmv4ZZejgR6Ln2uudVm
        POSTHOG_HOST: https://us.i.posthog.com
        # RevenueCat public SDK key is injected into Info.plist as RevenueCatAPIKey.
        # Debug uses the Test Store key (test_…) so paywall iteration does not
        # depend on App Store Connect. Release must use an App Store key (appl_…).
        # appl_REPLACE_ME / empty values skip configure and fall back to Mock.
        REVENUECAT_API_KEY: appl_FWKFhestdOkpZpYZCMTNHDpCfFZ
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: BeforeShow/BeforeShow.Debug.entitlements
          REVENUECAT_API_KEY: test_hBPlDvelppaflbazKfzVpfjTnEV
        Release:
          CODE_SIGN_ENTITLEMENTS: BeforeShow/BeforeShow.entitlements
          REVENUECAT_API_KEY: appl_FWKFhestdOkpZpYZCMTNHDpCfFZ
    scheme:
      testTargets:
        - BeforeShowTests
  BeforeShowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BeforeShowWidgets
      - path: Shared
    resources:
      - path: BeforeShowWidgets/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doublewaterapps.beforeshow.widgets
        PRODUCT_NAME: BeforeShowWidgets
        INFOPLIST_FILE: BeforeShowWidgets/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: BeforeShowWidgets/BeforeShowWidgets.entitlements
        TARGETED_DEVICE_FAMILY: 1
        ENABLE_USER_SCRIPT_SANDBOXING: true
  BeforeShowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BeforeShowTests
    dependencies:
      - target: BeforeShow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doublewaterapps.beforeshow.tests
        GENERATE_INFOPLIST_FILE: true
