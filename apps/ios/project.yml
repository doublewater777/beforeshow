name: BeforeShow
options:
  bundleIdPrefix: com.doublewaterapps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 29C8MS76CZ
    CODE_SIGN_STYLE: Automatic
targets:
  BeforeShow:
    type: application
    platform: iOS
    sources:
      - path: BeforeShow
    resources:
      - path: BeforeShow/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doublewaterapps.beforeshow
        PRODUCT_NAME: BeforeShow
        INFOPLIST_FILE: BeforeShow/Supporting/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        UILAUNCHSTORYBOARDNAME: LaunchScreen
        ENABLE_USER_SCRIPT_SANDBOXING: true
    scheme:
      testTargets:
        - BeforeShowTests
  BeforeShowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BeforeShowTests
    dependencies:
      - target: BeforeShow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doublewaterapps.beforeshow.tests
        GENERATE_INFOPLIST_FILE: true
