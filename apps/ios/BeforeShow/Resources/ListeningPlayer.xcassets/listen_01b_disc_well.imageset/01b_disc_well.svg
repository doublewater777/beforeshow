<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="floor" cx="46%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#2f3134"/>
      <stop offset="55%" stop-color="#222426"/>
      <stop offset="100%" stop-color="#121416"/>
    </radialGradient>
    <linearGradient id="lip" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#6a6d71"/>
      <stop offset="40%" stop-color="#2a2c2f"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>
  </defs>
  <!-- One coherent circular bay: floor + single lip. No competing concentric rings. -->
  <circle cx="256" cy="256" r="248" fill="url(#floor)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#lip)" stroke-width="10"/>
  <circle cx="256" cy="256" r="18" fill="#1b1d1f" stroke="#4e5154" stroke-width="2"/>
  <circle cx="256" cy="256" r="8" fill="#0c0d0e"/>
</svg>
