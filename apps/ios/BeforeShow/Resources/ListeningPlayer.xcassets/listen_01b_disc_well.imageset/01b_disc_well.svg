<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="floor" cx="46%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#2f3134"/>
      <stop offset="58%" stop-color="#222426"/>
      <stop offset="100%" stop-color="#121416"/>
    </radialGradient>
    <linearGradient id="lip" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#626569"/>
      <stop offset="48%" stop-color="#242629"/>
      <stop offset="100%" stop-color="#08090a"/>
    </linearGradient>
  </defs>
  <!-- One physical seating cavity: a single filled circle with one subtle outer lip.
       The spindle is owned by SwiftUI, so the well asset draws no center rings. -->
  <circle cx="256" cy="256" r="252" fill="url(#floor)" stroke="url(#lip)" stroke-width="6"/>
</svg>
