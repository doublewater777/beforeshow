<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeforeShow · 候选曲目 Playlist 风格（throwaway）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
      padding: 32px 20px 72px;
    }
    .page-head { max-width: 960px; margin: 0 auto 20px; }
    .badge {
      font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 8px;
    }
    h1 { font-size: 22px; font-weight: 600; }
    .page-head p {
      margin-top: 8px; font-size: 14px; line-height: 1.5;
      color: rgba(255,255,255,0.5); max-width: 560px;
    }
    .controls {
      max-width: 960px; margin: 0 auto 24px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .control-label { font-size: 12px; color: rgba(255,255,255,0.35); margin-right: 4px; }
    .chip {
      appearance: none; border: none; background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 500;
      padding: 8px 14px; border-radius: 999px; cursor: pointer; font-family: inherit;
    }
    .chip.active { background: #fff; color: #000; }

    .stage {
      display: flex; flex-wrap: wrap; gap: 36px;
      justify-content: center; max-width: 960px; margin: 0 auto;
    }
    .phone-label {
      text-align: center; font-size: 13px; color: rgba(255,255,255,0.4);
      margin-bottom: 10px; font-style: italic;
    }

    /* Device */
    .frame {
      padding: 11px; background: #000; border-radius: 58px;
      box-shadow: 0 0 0 1px #222, 0 30px 80px rgba(0,0,0,0.65);
    }
    .screen {
      width: 393px; height: 852px; border-radius: 48px;
      overflow: hidden; position: relative; background: #000;
    }
    .status {
      position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; font-size: 15px; font-weight: 600;
      color: #fff; mix-blend-mode: difference; pointer-events: none;
    }
    .island {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 34px; background: #000; border-radius: 999px; z-index: 40;
    }
    .home {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 134px; height: 5px; background: rgba(255,255,255,0.55);
      border-radius: 99px; z-index: 40;
    }

    .app {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background: #000;
    }

    /* Hero — Apple Music / Spotify playlist header */
    .hero {
      position: relative; flex-shrink: 0;
      padding: 58px 20px 18px;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center 30%;
      transform: scale(1.12);
      filter: blur(28px) saturate(1.15);
      opacity: 0.55;
    }
    .hero-veil {
      position: absolute; inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.55) 45%,
        #000 100%
      );
    }
    .hero-top {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: rgba(0,0,0,0.35); backdrop-filter: blur(12px);
      color: #fff; font-size: 18px; cursor: pointer;
      display: grid; place-items: center;
    }
    .hero-art-wrap {
      position: relative; z-index: 2;
      display: flex; justify-content: center; margin-bottom: 18px;
    }
    /* 现场海报 3:4，不是方封面 */
    .hero-art {
      width: 168px;
      aspect-ratio: 3 / 4;
      height: auto;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 16px 48px rgba(0,0,0,0.55);
      background: #1a1a1a;
      display: block;
    }
    .hero-art.ph {
      display: grid; place-items: center;
      background: linear-gradient(145deg, #2a2430, #121014);
      color: rgba(255,255,255,0.35); font-size: 42px;
      width: 168px;
      aspect-ratio: 3 / 4;
    }
    .hero-text { position: relative; z-index: 2; }
    .hero-text .type {
      font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.65);
      margin-bottom: 6px;
    }
    .hero-text h2 {
      font-size: 26px; font-weight: 700; letter-spacing: -0.03em;
      line-height: 1.15; margin-bottom: 8px;
    }
    .hero-text .by {
      font-size: 13px; color: rgba(255,255,255,0.75);
      display: flex; align-items: center; gap: 8px;
    }
    .hero-text .by img {
      width: 22px; height: 22px; border-radius: 50%; object-fit: cover;
    }
    .hero-text .stats {
      margin-top: 6px; font-size: 12px; color: rgba(255,255,255,0.45);
    }

    /* Actions — Apple Music toolbar: equal icon circles + caption */
    .action-bar {
      position: relative; z-index: 2;
      display: flex; align-items: flex-start; justify-content: flex-start;
      gap: 22px;
      margin-top: 18px;
    }
    .action-item {
      appearance: none; border: none; background: transparent;
      padding: 0; cursor: pointer; font-family: inherit;
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      min-width: 52px;
      color: #fff;
    }
    .action-item:disabled {
      cursor: default;
      opacity: 1; /* reserved slot stays in layout; icon itself is quieter */
    }
    .action-item .glyph {
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background .15s, transform .12s;
    }
    .action-item:not(:disabled):active .glyph {
      background: rgba(255,255,255,0.2);
      transform: scale(0.96);
    }
    .action-item .glyph svg {
      width: 20px; height: 20px;
      fill: none; stroke: currentColor; stroke-width: 1.75;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .action-item .glyph svg.filled { fill: currentColor; stroke: none; }
    /* Play: reserved — same slot, quieter so layout doesn't jump later */
    .action-item.is-reserved {
      pointer-events: none;
    }
    .action-item.is-reserved .glyph {
      background: rgba(255,255,255,0.06);
      border: 1px dashed rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.28);
    }
    .action-item .cap {
      font-size: 11px; font-weight: 500;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.01em;
    }
    .action-item.is-reserved .cap {
      color: rgba(255,255,255,0.28);
    }
    /* Filters */
    .filters-wrap {
      flex-shrink: 0;
      padding: 8px 0 4px;
      background: #000;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .filters {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 6px 16px 10px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter {
      flex-shrink: 0; appearance: none; border: none;
      padding: 8px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 600; font-family: inherit;
      background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75);
      cursor: pointer; white-space: nowrap;
    }
    .filter.active {
      background: #fff; color: #000;
    }
    .filter .dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: currentColor; margin-right: 6px; opacity: 0.5;
      vertical-align: middle;
    }

    /* Main track list — browse only */
    .tracks {
      flex: 1; overflow-y: auto; padding: 0 0 36px;
      scrollbar-width: none; background: #000;
    }
    .tracks::-webkit-scrollbar { display: none; }

    .track {
      display: flex; align-items: center;
      padding: 0 8px 0 16px;
      min-height: 54px;
      position: relative;
      background: #000;
      user-select: none;
    }
    .track::after {
      content: "";
      position: absolute; left: 16px; right: 0; bottom: 0;
      height: 1px; background: rgba(255,255,255,0.06);
    }
    .track:active { background: rgba(255,255,255,0.04); }
    .track-body {
      flex: 1; min-width: 0;
      padding: 12px 8px 12px 0;
      cursor: pointer;
    }
    .track-title {
      font-size: 16px; font-weight: 400; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-sub {
      font-size: 13px; color: rgba(255,255,255,0.45);
      margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-more {
      width: 40px; height: 54px; border: none; background: transparent;
      color: rgba(255,255,255,0.35); font-size: 18px; cursor: pointer;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }

    .list-foot {
      padding: 16px 20px 8px;
      font-size: 12px; color: rgba(255,255,255,0.3); line-height: 1.45;
    }
    .empty {
      padding: 48px 24px; text-align: center; color: rgba(255,255,255,0.4);
      font-size: 14px;
    }

    /* —— Spotify-style full sheets —— */
    .modal {
      position: absolute; inset: 0; z-index: 50;
      display: flex; flex-direction: column;
      background: #121212;
      transform: translateY(105%);
      transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.2, 1);
      pointer-events: none;
    }
    .modal.open {
      transform: translateY(0);
      pointer-events: auto;
    }
    .modal-top {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 58px 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .modal-top .link {
      border: none; background: transparent;
      color: rgba(255,255,255,0.7); font-size: 16px;
      font-family: inherit; cursor: pointer; padding: 8px 10px;
      min-width: 64px;
    }
    .modal-top .link.primary {
      color: #fff; font-weight: 700;
    }
    .modal-top .title {
      font-size: 16px; font-weight: 700; color: #fff; text-align: center;
    }
    .modal-body {
      flex: 1; overflow-y: auto; padding-bottom: 28px;
      scrollbar-width: none;
    }
    .modal-body::-webkit-scrollbar { display: none; }

    .modal-hint {
      padding: 14px 16px 8px;
      font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.4;
    }

    /* Edit list rows inside modal */
    .e-track {
      display: flex; align-items: center;
      min-height: 56px; padding: 0 6px 0 4px;
      position: relative; background: #121212;
      user-select: none;
    }
    .e-track::after {
      content: ""; position: absolute; left: 48px; right: 44px; bottom: 0;
      height: 1px; background: rgba(255,255,255,0.07);
    }
    .e-track.dragging {
      background: #282828; z-index: 3;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0.95;
    }
    .e-track.drag-over-before::before {
      content: ""; position: absolute; left: 12px; right: 12px; top: 0;
      height: 2px; background: #1db954; border-radius: 2px; z-index: 2;
    }
    .e-track.drag-over-after::after {
      content: ""; position: absolute; left: 12px; right: 12px; bottom: 0;
      height: 2px; background: #1db954; border-radius: 2px;
    }
    .e-remove {
      width: 44px; height: 56px; border: none; background: transparent;
      display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
    }
    .e-remove .x {
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: #fff; font-size: 14px;
      display: grid; place-items: center; line-height: 1;
    }
    .e-body { flex: 1; min-width: 0; padding: 10px 6px; cursor: pointer; }
    .e-body .t { font-size: 15px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .e-body .a { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 2px; }
    .e-handle {
      width: 44px; height: 56px; border: none; background: transparent;
      color: rgba(255,255,255,0.4); cursor: grab; touch-action: none;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .e-handle:active { cursor: grabbing; color: #fff; }
    .e-handle svg { width: 20px; height: 20px; fill: currentColor; }

    .e-add {
      display: flex; align-items: center; gap: 14px;
      margin: 8px 16px 16px; padding: 14px 16px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04); cursor: pointer; color: #fff;
    }
    .e-add:active { background: rgba(255,255,255,0.08); }
    .e-add .ic {
      width: 40px; height: 40px; border-radius: 4px;
      background: rgba(255,255,255,0.08);
      display: grid; place-items: center; font-size: 22px;
    }
    .e-add .tx { font-size: 15px; font-weight: 600; }
    .e-add .sub { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 2px; }

    /* Add sheet form */
    .add-search {
      margin: 12px 16px 8px;
      display: flex; align-items: center; gap: 10px;
      background: #242424; border-radius: 8px; padding: 0 12px;
      height: 44px;
    }
    .add-search input {
      flex: 1; border: none; background: transparent; outline: none;
      color: #fff; font-size: 15px; font-family: inherit;
    }
    .add-search input::placeholder { color: rgba(255,255,255,0.35); }
    .field {
      margin: 10px 16px 0;
    }
    .field label {
      display: block; font-size: 12px; color: rgba(255,255,255,0.45);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%; height: 44px; border-radius: 8px; border: none;
      background: #242424; color: #fff; font-size: 15px;
      padding: 0 12px; font-family: inherit; outline: none;
    }
    .field input:focus { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
    .add-submit {
      margin: 20px 16px 0; width: calc(100% - 32px); height: 48px;
      border: none; border-radius: 999px;
      background: #fff; color: #000;
      font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
    }
    .add-submit:disabled {
      opacity: 0.35; cursor: default;
    }
    .add-submit:not(:disabled):active { transform: scale(0.98); }

    /* Small action sheet for ··· */
    .action-scrim {
      position: absolute; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 60; display: none; align-items: flex-end;
      padding: 12px 10px 34px;
    }
    .action-scrim.open { display: flex; }
    .action-sheet {
      width: 100%; display: flex; flex-direction: column; gap: 8px;
    }
    .action-group {
      background: #282828; border-radius: 12px; overflow: hidden;
    }
    .action-group .meta {
      padding: 14px 16px 12px;
      text-align: center; font-size: 13px; color: rgba(255,255,255,0.45);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      line-height: 1.35;
    }
    .action-group button {
      width: 100%; border: none; background: transparent;
      color: #fff; font-size: 16px; font-weight: 500;
      font-family: inherit; padding: 15px; cursor: pointer;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .action-group button:first-of-type { border-top: none; }
    .action-group button.destructive { color: #f15e6c; }
    .action-group button:active { background: rgba(255,255,255,0.06); }
    .action-cancel {
      width: 100%; border: none; background: #282828;
      color: #fff; font-size: 16px; font-weight: 700;
      font-family: inherit; padding: 15px; border-radius: 12px; cursor: pointer;
    }

    /* toast + share */
    .toast {
      position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%) translateY(8px);
      background: #fff; color: #111; font-size: 13px; font-weight: 600;
      padding: 10px 16px; border-radius: 999px; z-index: 60;
      opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .scrim {
      position: absolute; inset: 0; background: rgba(0,0,0,0.55);
      z-index: 50; display: none; align-items: flex-end; padding: 16px 16px 36px;
    }
    .scrim.open { display: flex; }
    .sheet {
      width: 100%; background: #1c1c1e; border-radius: 16px; padding: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .sheet-card {
      border-radius: 12px; overflow: hidden;
      background: #121214; aspect-ratio: 1;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 20px; position: relative;
    }
    .sheet-card::before {
      content: ""; position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: blur(20px) brightness(0.45); transform: scale(1.2);
    }
    .sheet-card > * { position: relative; z-index: 1; }
    .sheet-card .s-type { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
    .sheet-card .s-title { font-size: 22px; font-weight: 700; margin-top: 8px; line-height: 1.2; }
    .sheet-card .s-list { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.5; max-height: 42%; overflow: hidden; }
    .sheet-card .s-foot { margin-top: 12px; font-size: 11px; color: rgba(255,255,255,0.35); }
    .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .sheet-actions button {
      height: 44px; border-radius: 12px; border: none; font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    .sheet-actions .p { background: #fff; color: #000; }
    .sheet-actions .g { background: rgba(255,255,255,0.1); color: #fff; }

    .notes {
      max-width: 960px; margin: 36px auto 0; padding: 16px 18px;
      border-radius: 14px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.48);
    }
    .notes strong { color: rgba(255,255,255,0.8); }
    .notes ul { margin: 8px 0 0 18px; }
  </style>
</head>
<body>
  <div class="page-head">
    <div class="badge">Prototype · throwaway · playlist style</div>
    <h1>候选曲目 · 歌单页</h1>
    <p>
      主页只浏览。点「编辑」弹出 Spotify 式编辑页（排序 / 删除 / 进添加）。
      点「添加歌曲」再弹一层添加表单。单艺人无筛选。
    </p>
  </div>

  <div class="controls">
    <span class="control-label">场景</span>
    <button type="button" class="chip active" data-scene="concert">演唱会 · 单艺人</button>
    <button type="button" class="chip" data-scene="festival">音乐节 · 多艺人</button>
  </div>

  <div class="stage">
    <div>
      <div class="phone-label" id="label">演唱会 · 全部曲目</div>
      <div class="frame">
        <div class="screen" id="screen">
          <div class="status"><span>9:41</span><span style="opacity:.75">■■■</span></div>
          <div class="island"></div>
          <div class="app" id="app"></div>

          <!-- Edit playlist sheet (Spotify-like) -->
          <div class="modal" id="editModal">
            <div class="modal-top">
              <button type="button" class="link" id="editCancel">取消</button>
              <div class="title">编辑歌单</div>
              <button type="button" class="link primary" id="editDone">完成</button>
            </div>
            <div class="modal-body" id="editBody"></div>
          </div>

          <!-- Add song sheet -->
          <div class="modal" id="addModal">
            <div class="modal-top">
              <button type="button" class="link" id="addCancel">取消</button>
              <div class="title">添加歌曲</div>
              <span style="min-width:64px"></span>
            </div>
            <div class="modal-body" id="addBody"></div>
          </div>

          <div class="scrim" id="scrim">
            <div class="sheet">
              <div class="sheet-card" id="shareCard"></div>
              <div class="sheet-actions">
                <button type="button" class="g" id="closeShare">关闭</button>
                <button type="button" class="p" id="saveShare">保存图片</button>
              </div>
            </div>
          </div>
          <div class="action-scrim" id="actionScrim">
            <div class="action-sheet" id="actionSheet"></div>
          </div>
          <div class="toast" id="toast">已复制</div>
          <div class="home"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="notes">
    <strong>交互约定</strong>
    <ul>
      <li><b>主页</b>：浏览 + 复制/分享/编辑入口；不进编辑态。</li>
      <li><b>编辑弹窗</b>：取消 / 完成；拖拽排序、删除、入口「添加歌曲」。</li>
      <li><b>添加弹窗</b>：歌名 + 艺人表单 → 添加到歌单。</li>
    </ul>
  </div>

  <script>
    const POSTER = "poster-sample.jpg";
    const AV = "avatar-a.jpg";

    let uid = 0;
    function tid() { return "t" + (++uid); }
    function withIds(list) {
      return list.map((t) => ({ id: tid(), title: t.title, artist: t.artist }));
    }

    const DATA = {
      concert: {
        type: "猜歌单",
        title: "回到那一天 · 杭州",
        by: "五月天",
        cover: POSTER,
        tracks: withIds([
          { title: "倔强", artist: "五月天" },
          { title: "温柔", artist: "五月天" },
          { title: "知足", artist: "五月天" },
          { title: "突然好想你", artist: "五月天" },
          { title: "干杯", artist: "五月天" },
          { title: "离开地球表面", artist: "五月天" },
          { title: "恋爱ing", artist: "五月天" },
          { title: "派对动物", artist: "五月天" },
          { title: "人生海海", artist: "五月天" },
          { title: "憨人", artist: "五月天" },
          { title: "后来的我们", artist: "五月天" },
          { title: "倔强 (Encore)", artist: "五月天" },
        ]),
      },
      festival: {
        type: "猜歌单",
        title: "绿洲音乐节 · 湖州",
        by: "多艺人",
        cover: POSTER,
        tracks: withIds([
          { title: "刀马旦", artist: "刘雨昕" },
          { title: "光", artist: "刘雨昕" },
          { title: "星河入梦", artist: "刘雨昕" },
          { title: "Yes! Ok!", artist: "刘雨昕" },
          { title: "仙儿", artist: "二手玫瑰" },
          { title: "允许部分艺术家先富起来", artist: "二手玫瑰" },
          { title: "狼心狗肺", artist: "二手玫瑰" },
          { title: "列车", artist: "声音玩具" },
          { title: "生活在别处", artist: "声音玩具" },
          { title: "旅行的意义", artist: "声音玩具" },
        ]),
      },
    };

    let scene = "concert";
    let filter = "全部";
    let dragId = null;
    // Snapshot for cancel on edit modal
    let editSnapshot = null;

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(window.__tt);
      window.__tt = setTimeout(() => el.classList.remove("show"), 1400);
    }

    function data() { return DATA[scene]; }

    function artistsOf(d) {
      const set = [];
      d.tracks.forEach((t) => {
        if (!set.includes(t.artist)) set.push(t.artist);
      });
      return set;
    }

    function filteredTracks(d) {
      if (filter === "全部") return d.tracks.slice();
      return d.tracks.filter((t) => t.artist === filter);
    }

    function indexInFull(id) {
      return data().tracks.findIndex((t) => t.id === id);
    }

    function moveTrack(fromId, toId, placeAfter) {
      if (fromId === toId) return;
      const arr = data().tracks;
      const from = arr.findIndex((t) => t.id === fromId);
      let to = arr.findIndex((t) => t.id === toId);
      if (from < 0 || to < 0) return;
      const [item] = arr.splice(from, 1);
      to = arr.findIndex((t) => t.id === toId);
      if (placeAfter) to += 1;
      if (to < 0) to = arr.length;
      arr.splice(to, 0, item);
    }

    function removeTrack(id) {
      const arr = data().tracks;
      const i = arr.findIndex((t) => t.id === id);
      if (i >= 0) arr.splice(i, 1);
    }

    function closeActionSheet() {
      document.getElementById("actionScrim").classList.remove("open");
    }

    function openTrackActions(track) {
      const sheet = document.getElementById("actionSheet");
      sheet.innerHTML = `
        <div class="action-group">
          <div class="meta">${track.title}<br>${track.artist}</div>
          <button type="button" data-act="search">在音乐 App 中搜索</button>
          <button type="button" data-act="editinfo">编辑信息</button>
          <button type="button" class="destructive" data-act="remove">从歌单移除</button>
        </div>
        <button type="button" class="action-cancel" data-act="cancel">取消</button>
      `;
      document.getElementById("actionScrim").classList.add("open");
      sheet.querySelectorAll("[data-act]").forEach((btn) => {
        btn.onclick = () => {
          const act = btn.dataset.act;
          closeActionSheet();
          if (act === "search") toast(`搜索「${track.title}」`);
          else if (act === "editinfo") {
            const title = window.prompt("歌曲名称", track.title);
            if (title == null) return;
            const t = title.trim();
            if (!t) return;
            const artist = window.prompt("艺人", track.artist);
            if (artist == null) return;
            const a = artist.trim();
            if (!a) return;
            track.title = t;
            track.artist = a;
            render();
            toast("已更新");
          } else if (act === "remove") {
            removeTrack(track.id);
            toast("已从歌单移除");
            render();
          }
        };
      });
    }

    function copyAll() {
      const d = data();
      const list = filteredTracks(d);
      const body = list.map((t, i) => `${i + 1}. ${t.title} - ${t.artist}`).join("\n");
      const scope = filter === "全部" ? "全部" : filter;
      const text = `${d.title}\n猜歌单 · ${scope}（非官方）\n\n${body}\n\n— 开场前 BeforeShow`;
      if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
      toast(filter === "全部" ? "已复制全部歌单" : `已复制「${filter}」`);
    }

    function openShare() {
      const d = data();
      const list = filteredTracks(d);
      const lines = list.slice(0, 10).map((t) => t.title).join(" · ");
      const more = list.length > 10 ? ` 等 ${list.length} 首` : ` · ${list.length} 首`;
      document.getElementById("shareCard").innerHTML = `
        <div class="s-type">BeforeShow · 猜歌单</div>
        <div class="s-title">${d.title}</div>
        <div class="s-list">${lines}${more}</div>
        <div class="s-foot">非官方推测 · 顺序为演出顺序</div>
      `;
      let style = document.getElementById("shareCoverStyle");
      if (!style) {
        style = document.createElement("style");
        style.id = "shareCoverStyle";
        document.head.appendChild(style);
      }
      style.textContent = `.sheet-card::before{background-image:url('${d.cover}')}`;
      document.getElementById("scrim").classList.add("open");
    }

    function openEditModal() {
      editSnapshot = JSON.parse(JSON.stringify(data().tracks));
      renderEditBody();
      document.getElementById("editModal").classList.add("open");
    }

    function closeEditModal(restore) {
      if (restore && editSnapshot) {
        data().tracks = editSnapshot;
      }
      editSnapshot = null;
      document.getElementById("editModal").classList.remove("open");
      render();
    }

    function openAddModal() {
      const d = data();
      const arts = artistsOf(d);
      const defaultArtist = arts[0] || d.by || "";
      document.getElementById("addBody").innerHTML = `
        <p class="modal-hint">把你觉得当晚会唱的歌加进猜歌单。</p>
        <div class="field">
          <label>歌曲名称</label>
          <input id="addTitle" type="text" placeholder="歌名" autocomplete="off" />
        </div>
        <div class="field">
          <label>艺人</label>
          <input id="addArtist" type="text" placeholder="艺人" value="${defaultArtist.replace(/"/g, "&quot;")}" autocomplete="off" />
        </div>
        <button type="button" class="add-submit" id="addSubmit" disabled>添加到歌单</button>
      `;
      document.getElementById("addModal").classList.add("open");
      const title = document.getElementById("addTitle");
      const artist = document.getElementById("addArtist");
      const submit = document.getElementById("addSubmit");
      const sync = () => {
        submit.disabled = !title.value.trim() || !artist.value.trim();
      };
      title.addEventListener("input", sync);
      artist.addEventListener("input", sync);
      setTimeout(() => title.focus(), 280);
      submit.onclick = () => {
        const t = title.value.trim();
        const a = artist.value.trim();
        if (!t || !a) return;
        data().tracks.push({ id: tid(), title: t, artist: a });
        document.getElementById("addModal").classList.remove("open");
        renderEditBody();
        render();
        toast("已添加");
        // stay in edit sheet if it was open
        if (!document.getElementById("editModal").classList.contains("open")) {
          // opened from ··· path rare; ok
        }
      };
    }

    function renderEditBody() {
      const d = data();
      const handleIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7" width="14" height="1.8" rx="0.9"/><rect x="5" y="11.1" width="14" height="1.8" rx="0.9"/><rect x="5" y="15.2" width="14" height="1.8" rx="0.9"/></svg>`;
      const rows = d.tracks.length
        ? d.tracks
            .map(
              (t) => `
          <div class="e-track" data-id="${t.id}">
            <button type="button" class="e-remove" aria-label="移除"><span class="x">×</span></button>
            <div class="e-body">
              <div class="t">${t.title}</div>
              <div class="a">${t.artist}</div>
            </div>
            <button type="button" class="e-handle" aria-label="拖动排序">${handleIcon}</button>
          </div>`
            )
            .join("")
        : `<div class="empty">还没有歌曲</div>`;

      document.getElementById("editBody").innerHTML = `
        <div class="e-add" id="editOpenAdd">
          <div class="ic">+</div>
          <div>
            <div class="tx">添加歌曲</div>
            <div class="sub">打开添加页写入歌名与艺人</div>
          </div>
        </div>
        <p class="modal-hint">按住右侧手柄拖动，调整你猜的演出顺序。</p>
        ${rows}
      `;

      document.getElementById("editOpenAdd").onclick = openAddModal;

      document.querySelectorAll(".e-track").forEach((row) => {
        const id = row.dataset.id;
        row.querySelector(".e-remove").onclick = () => {
          removeTrack(id);
          renderEditBody();
        };
        row.querySelector(".e-body").onclick = () => {
          const track = d.tracks.find((t) => t.id === id);
          if (!track) return;
          const title = window.prompt("歌曲名称", track.title);
          if (title == null) return;
          const t = title.trim();
          if (!t) return;
          const artist = window.prompt("艺人", track.artist);
          if (artist == null) return;
          const a = artist.trim();
          if (!a) return;
          track.title = t;
          track.artist = a;
          renderEditBody();
        };
        bindEditDrag(row);
      });
    }

    function bindEditDrag(row) {
      const handle = row.querySelector(".e-handle");
      const id = row.dataset.id;
      handle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        dragId = id;
        row.classList.add("dragging");
        try { row.setPointerCapture(e.pointerId); } catch (_) {}
      });
      row.addEventListener("pointermove", (e) => {
        if (dragId !== id) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const over = el && el.closest(".e-track");
        document.querySelectorAll(".e-track").forEach((n) => {
          n.classList.remove("drag-over-before", "drag-over-after");
        });
        if (over && over.dataset.id !== dragId) {
          const rect = over.getBoundingClientRect();
          const mid = rect.top + rect.height / 2;
          if (e.clientY < mid) over.classList.add("drag-over-before");
          else over.classList.add("drag-over-after");
        }
      });
      row.addEventListener("pointerup", (e) => {
        if (dragId !== id) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const over = el && el.closest(".e-track");
        const placeAfter = over && over.classList.contains("drag-over-after");
        document.querySelectorAll(".e-track").forEach((n) => {
          n.classList.remove("drag-over-before", "drag-over-after", "dragging");
        });
        if (over && over.dataset.id && over.dataset.id !== dragId) {
          moveTrack(dragId, over.dataset.id, placeAfter);
          dragId = null;
          renderEditBody();
          return;
        }
        dragId = null;
      });
      row.addEventListener("pointercancel", () => {
        row.classList.remove("dragging");
        document.querySelectorAll(".e-track").forEach((n) => {
          n.classList.remove("drag-over-before", "drag-over-after");
        });
        dragId = null;
      });
    }

    function render() {
      const d = data();
      const arts = artistsOf(d);
      const multi = arts.length > 1;
      if (filter !== "全部" && !arts.includes(filter)) filter = "全部";
      const tracks = filteredTracks(d);

      document.getElementById("label").textContent =
        (scene === "concert" ? "演唱会" : "音乐节") +
        " · " +
        (filter === "全部" ? "全部曲目" : filter);

      const filterChips = ["全部", ...arts]
        .map(
          (a) =>
            `<button type="button" class="filter ${filter === a ? "active" : ""}" data-filter="${a}">${a}</button>`
        )
        .join("");
      const showFilters = multi;

      const trackRows = tracks.length
        ? tracks
            .map((t) => {
              const subHtml =
                multi && filter === "全部"
                  ? `<div class="track-sub">${t.artist}</div>`
                  : "";
              return `
              <div class="track" data-id="${t.id}">
                <div class="track-body">
                  <div class="track-title">${t.title}</div>
                  ${subHtml}
                </div>
                <button type="button" class="track-more" aria-label="更多">···</button>
              </div>`;
            })
            .join("")
        : `<div class="empty">这个筛选下没有歌曲</div>`;

      const byline = multi ? `${arts.length} 位艺人` : d.by;
      const iconPlay = `<svg class="filled" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5L8 5.5z"/></svg>`;
      const iconCopy = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>`;
      const iconShare = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>`;
      const iconEdit = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;

      document.getElementById("app").innerHTML = `
        <div class="hero">
          <div class="hero-bg" style="background-image:url('${d.cover}')"></div>
          <div class="hero-veil"></div>
          <div class="hero-top">
            <button type="button" class="icon-btn" id="btnBack">‹</button>
            <span style="width:36px"></span>
          </div>
          <div class="hero-art-wrap">
            <img class="hero-art" src="${d.cover}" alt="" />
          </div>
          <div class="hero-text">
            <div class="type">${d.type}</div>
            <h2>${d.title}</h2>
            <div class="by">
              <img src="${AV}" alt="" onerror="this.style.display='none'" />
              <span>${byline}</span>
            </div>
            <div class="stats">${d.tracks.length} 首 · 推测演出顺序 · 非官方</div>
            <div class="action-bar">
              <button type="button" class="action-item is-reserved" disabled aria-label="播放（即将支持）">
                <span class="glyph">${iconPlay}</span>
                <span class="cap">播放</span>
              </button>
              <button type="button" class="action-item" id="btnCopy">
                <span class="glyph">${iconCopy}</span>
                <span class="cap">复制</span>
              </button>
              <button type="button" class="action-item" id="btnShare">
                <span class="glyph">${iconShare}</span>
                <span class="cap">分享</span>
              </button>
              <button type="button" class="action-item" id="btnEdit">
                <span class="glyph">${iconEdit}</span>
                <span class="cap">编辑</span>
              </button>
            </div>
          </div>
        </div>
        ${
          showFilters
            ? `<div class="filters-wrap"><div class="filters">${filterChips}</div></div>`
            : ""
        }
        <div class="tracks">
          ${trackRows}
          <div class="list-foot">点歌曲搜索 · 点 ··· 更多 · 点「编辑」打开编辑弹窗</div>
        </div>
      `;

      document.getElementById("btnEdit").onclick = openEditModal;
      document.getElementById("btnCopy").onclick = copyAll;
      document.getElementById("btnShare").onclick = openShare;

      document.querySelectorAll("[data-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          filter = btn.dataset.filter;
          render();
        });
      });

      document.querySelectorAll(".track").forEach((row) => {
        const id = row.dataset.id;
        const track = d.tracks.find((t) => t.id === id);
        if (!track) return;
        row.querySelector(".track-body").onclick = () => toast(`搜索「${track.title}」`);
        row.querySelector(".track-more").onclick = (e) => {
          e.stopPropagation();
          openTrackActions(track);
        };
      });
    }

    document.getElementById("editCancel").onclick = () => closeEditModal(true);
    document.getElementById("editDone").onclick = () => {
      editSnapshot = null;
      document.getElementById("editModal").classList.remove("open");
      render();
      toast("已保存修改");
    };
    document.getElementById("addCancel").onclick = () => {
      document.getElementById("addModal").classList.remove("open");
    };

    document.getElementById("closeShare").onclick = () =>
      document.getElementById("scrim").classList.remove("open");
    document.getElementById("saveShare").onclick = () => toast("保存图片（示意）");
    document.getElementById("scrim").onclick = (e) => {
      if (e.target.id === "scrim") e.currentTarget.classList.remove("open");
    };
    document.getElementById("actionScrim").onclick = (e) => {
      if (e.target.id === "actionScrim") closeActionSheet();
    };

    document.querySelectorAll("[data-scene]").forEach((btn) => {
      btn.addEventListener("click", () => {
        scene = btn.dataset.scene;
        filter = "全部";
        document.getElementById("editModal").classList.remove("open");
        document.getElementById("addModal").classList.remove("open");
        document.querySelectorAll("[data-scene]").forEach((b) => b.classList.toggle("active", b === btn));
        render();
      });
    });

    render();
  </script>
</body>
</html>
