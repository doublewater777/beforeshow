<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeforeShow · 首页 01 主行动（throwaway）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse 80% 50% at 50% 0%, #1a1428 0%, #050508 55%, #000);
      color: #e8e8ea;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      padding: 32px 20px 72px;
    }
    .page-head { max-width: 960px; margin: 0 auto 18px; }
    .badge {
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: rgba(255,255,255,0.38); margin-bottom: 8px;
    }
    h1 { font-size: 22px; font-weight: 600; color: #fff; }
    .page-head p {
      margin-top: 8px; font-size: 14px; line-height: 1.55;
      color: rgba(255,255,255,0.52); max-width: 640px;
    }
    .controls {
      max-width: 960px; margin: 0 auto 22px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .control-label { font-size: 12px; color: rgba(255,255,255,0.38); margin-right: 4px; }
    .chip {
      appearance: none; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.72);
      font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 999px;
      cursor: pointer; font-family: inherit;
    }
    .chip.active {
      background: #fff; color: #000; border-color: transparent;
    }

    .stage {
      display: flex; flex-wrap: wrap; gap: 36px;
      justify-content: center; max-width: 960px; margin: 0 auto;
    }
    .phone-label {
      text-align: center; font-size: 13px; color: rgba(255,255,255,0.42);
      margin-bottom: 10px; font-style: italic;
    }

    .frame {
      padding: 11px; background: #000; border-radius: 58px;
      box-shadow: 0 0 0 1px #222, 0 28px 80px rgba(0,0,0,0.6);
    }
    .screen {
      width: 393px; height: 852px; border-radius: 48px;
      overflow: hidden; position: relative; background: #000;
    }
    .status {
      position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; font-size: 15px; font-weight: 600; color: #fff;
      pointer-events: none;
    }
    .island {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 34px; background: #000; border-radius: 999px; z-index: 40;
    }
    .home-bar {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 134px; height: 5px; background: rgba(255,255,255,0.5);
      border-radius: 99px; z-index: 40;
    }

    .app {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background:
        radial-gradient(ellipse 90% 40% at 50% 10%, rgba(179,135,255,0.14), transparent 55%),
        radial-gradient(ellipse 60% 30% at 20% 80%, rgba(125,207,255,0.08), transparent 50%),
        #000;
    }

    /* Header */
    .header {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 58px 22px 10px;
      z-index: 5;
    }
    .header h2 {
      font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.72);
    }
    .header-actions { display: flex; gap: 10px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.10); color: #fff;
      font-size: 17px; font-weight: 600; cursor: pointer;
      display: grid; place-items: center;
    }

    .scroll {
      flex: 1; overflow-y: auto; padding: 6px 18px 110px;
      scrollbar-width: none;
    }
    .scroll::-webkit-scrollbar { display: none; }

    /* Poster 3:4 */
    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 18px 48px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .poster-wrap img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .poster-fade {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 40%,
        rgba(0,0,0,0.55) 72%,
        rgba(0,0,0,0.92) 100%
      );
      pointer-events: none;
    }
    .poster-meta {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 0 22px 22px; z-index: 2;
    }
    .poster-meta h3 {
      font-size: 22px; font-weight: 700; color: #fff;
      line-height: 1.25; margin-bottom: 6px;
    }
    .poster-meta p {
      font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.68);
    }

    /* Countdown */
    .countdown {
      margin-top: 22px;
      text-align: center;
    }
    .countdown .num-row {
      display: flex; align-items: baseline; justify-content: center; gap: 8px;
    }
    .countdown .num {
      font-size: 68px; font-weight: 300; line-height: 1;
      background: linear-gradient(90deg, #7dcfb0, #b387ff, #ffb347);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      letter-spacing: -0.02em;
    }
    .countdown .unit {
      font-size: 20px; font-weight: 400; color: rgba(255,255,255,0.72);
    }
    .countdown .today {
      font-size: 34px; font-weight: 300; letter-spacing: 0.04em;
      background: linear-gradient(90deg, #7dcfb0, #b387ff, #ffb347);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .countdown .helper {
      margin-top: 8px; font-size: 16px; font-weight: 500;
      color: rgba(255,255,255,0.45);
    }

    /* Primary action — one of three */
    .primary {
      margin-top: 18px;
    }

    /* A: Tips — light glass, not a billboard */
    .tips {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 14px 13px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      cursor: pointer;
    }
    .tips:active { background: rgba(255,255,255,0.1); }
    .tips .msg {
      flex: 1; font-size: 14px; font-weight: 500;
      color: rgba(255,255,255,0.88); line-height: 1.35;
      text-align: left;
    }
    .tips .cta {
      flex-shrink: 0; border: none;
      font-size: 13px; font-weight: 600; font-family: inherit;
      color: #000; background: #fff;
      padding: 8px 14px; border-radius: 999px; cursor: pointer;
      white-space: nowrap;
    }

    /* B: Departure — slightly stronger, day-of safety */
    .depart {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 14px 14px 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(125,207,255,0.14), rgba(255,255,255,0.05));
      border: 1px solid rgba(125,207,255,0.28);
      cursor: pointer;
    }
    .depart:active { filter: brightness(1.06); }
    .depart .ico {
      width: 40px; height: 40px; border-radius: 12px;
      background: rgba(125,207,255,0.16);
      color: rgb(125,207,255);
      display: grid; place-items: center; font-size: 16px; flex-shrink: 0;
    }
    .depart .body { flex: 1; min-width: 0; text-align: left; }
    .depart .eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: rgba(255,255,255,0.42); margin-bottom: 3px;
    }
    .depart .msg {
      font-size: 14px; font-weight: 600; color: #fff; line-height: 1.3;
    }
    .depart .sub {
      font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px;
    }
    .depart .cta {
      flex-shrink: 0; border: none;
      font-size: 13px; font-weight: 600; font-family: inherit;
      color: #0a0a0c;
      background: linear-gradient(90deg, #7dcfb0, #b387ff);
      padding: 8px 12px; border-radius: 999px; cursor: pointer;
      white-space: nowrap;
    }
    /* C: Cold start — whisper, not a task */
    .cold {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
    }
    .cold:active { background: rgba(255,255,255,0.07); }
    .cold .msg {
      flex: 1; font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.62); line-height: 1.4; text-align: left;
    }
    .cold .cta {
      flex-shrink: 0; border: none; background: transparent;
      font-size: 13px; font-weight: 600; font-family: inherit;
      color: rgba(255,255,255,0.85); cursor: pointer;
      padding: 6px 4px;
    }

    .none-note {
      margin-top: 18px; text-align: center;
      font-size: 12px; color: rgba(255,255,255,0.28);
      letter-spacing: 0.02em;
    }

    /* Tab bar */
    .tab-bar {
      position: absolute; left: 16px; right: 16px; bottom: 26px;
      height: 68px; border-radius: 26px; z-index: 30;
      background: rgba(28,28,30,0.82);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; padding: 6px;
    }
    .tab {
      flex: 1; height: 100%; border: none; background: transparent;
      color: rgba(255,255,255,0.4); font-size: 11px; font-weight: 500;
      font-family: inherit; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      border-radius: 20px;
    }
    .tab.active {
      color: #fff; background: rgba(255,255,255,0.12); font-weight: 600;
    }

    .toast {
      position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%);
      background: rgba(255,255,255,0.92); color: #111;
      font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 999px;
      opacity: 0; transition: opacity .2s; z-index: 50; pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    .notes {
      max-width: 960px; margin: 36px auto 0; padding: 16px 18px;
      border-radius: 14px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 13px; line-height: 1.65; color: rgba(255,255,255,0.5);
    }
    .notes strong { color: rgba(255,255,255,0.82); }
    .notes table {
      width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px;
    }
    .notes th, .notes td {
      text-align: left; padding: 8px 6px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.55);
    }
    .notes th { color: rgba(255,255,255,0.75); font-weight: 600; }
  </style>
</head>
<body>
  <div class="page-head">
    <div class="badge">Prototype · throwaway · 首页 01</div>
    <h1>海报 + 倒计时 + 一条主行动</h1>
    <p>
      主行动互斥：出行提醒 &gt; Tips &gt; 冷启动 &gt; 无。
      Tips 收成轻玻璃卡；出行略强调；冷启动更轻。无工具宫格。
    </p>
  </div>

  <div class="controls">
    <span class="control-label">状态</span>
    <button type="button" class="chip active" data-scene="tips">开场前 · Tips 曲目</button>
    <button type="button" class="chip" data-scene="depart">当天 · 出行提醒</button>
    <button type="button" class="chip" data-scene="cold">30 天外 · 冷启动</button>
    <button type="button" class="chip" data-scene="none">有去程 · 无 Tips</button>
  </div>

  <div class="stage">
    <div>
      <div class="phone-label" id="label">开场前 · Tips</div>
      <div class="frame">
        <div class="screen">
          <div class="status"><span>9:41</span><span style="opacity:.8">■■■</span></div>
          <div class="island"></div>
          <div class="app">
            <div class="header">
              <h2>当前现场</h2>
              <div class="header-actions">
                <button type="button" class="icon-btn">＋</button>
                <button type="button" class="icon-btn">···</button>
              </div>
            </div>
            <div class="scroll" id="scroll"></div>
            <nav class="tab-bar">
              <button type="button" class="tab active">当前</button>
              <button type="button" class="tab">我的现场</button>
              <button type="button" class="tab">设置</button>
            </nav>
          </div>
          <div class="toast" id="toast">—</div>
          <div class="home-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="notes">
    <strong>主行动互斥规则</strong>
    <table>
      <tr><th>条件</th><th>显示</th></tr>
      <tr><td>当天 + 已保存出门方案 + 未开场</td><td>出行提醒卡</td></tr>
      <tr><td>否则有 ShowTips</td><td>轻 Tips（文案 + 短按钮）</td></tr>
      <tr><td>否则 before 且 &gt;14 天</td><td>冷启动 → 候选曲目</td></tr>
      <tr><td>否则</td><td>不显示行动区</td></tr>
    </table>
  </div>

  <script>
    const POSTER = "poster-sample.jpg";

    const SCENES = {
      tips: {
        label: "开场前 · Tips 曲目",
        countdown: { kind: "days", n: "12", unit: "天", helper: "开场前 · 慢慢靠近" },
        show: "康士坦的变化球「犬的视线」杭州站",
        meta: "杭州 MAO Livehouse · 7月11日 19:00",
        action: "tips",
        tip: { msg: "还有 12 天，先去熟悉一下曲目？", cta: "去看看", open: "猜歌单" },
      },
      depart: {
        label: "当天 · 出行提醒",
        countdown: { kind: "today", helper: "19:00 开场 · MAO Livehouse" },
        show: "康士坦的变化球「犬的视线」杭州站",
        meta: "杭州 MAO Livehouse · 今天 19:00",
        action: "depart",
        depart: {
          msg: "18:20 出门 · 地铁约 35 分钟",
          sub: "预计 18:55 到场",
          cta: "打开地图",
        },
      },
      cold: {
        label: "30 天外 · 冷启动",
        countdown: { kind: "days", n: "30", unit: "天", helper: "开场前 · 先放着就好" },
        show: "绿洲音乐节2.0 · 湖州",
        meta: "吴乐湾音乐广场 · 8月8日",
        action: "cold",
        cold: {
          msg: "离开场还有一阵。想的话，可以先整理候选曲目。",
          cta: "去看看",
        },
      },
      none: {
        label: "有去程 · 无 Tips（7 天内已保存）",
        countdown: { kind: "days", n: "5", unit: "天", helper: "开场前 · 路线已备好" },
        show: "康士坦的变化球「犬的视线」杭州站",
        meta: "杭州 MAO Livehouse · 7月11日 19:00",
        action: "none",
      },
    };

    let scene = "tips";

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(window.__t);
      window.__t = setTimeout(() => el.classList.remove("show"), 1400);
    }

    function countdownHTML(c) {
      if (c.kind === "today") {
        return `
          <div class="countdown">
            <div class="today">就是今天</div>
            <div class="helper">${c.helper}</div>
          </div>`;
      }
      return `
        <div class="countdown">
          <div class="num-row">
            <span class="num">${c.n}</span>
            <span class="unit">${c.unit}</span>
          </div>
          <div class="helper">${c.helper}</div>
        </div>`;
    }

    function actionHTML(s) {
      if (s.action === "tips") {
        const t = s.tip;
        return `
          <div class="primary">
            <div class="tips" id="act">
              <div class="msg">${t.msg}</div>
              <button type="button" class="cta">${t.cta}</button>
            </div>
          </div>`;
      }
      if (s.action === "depart") {
        const d = s.depart;
        return `
          <div class="primary">
            <div class="depart" id="act">
              <div class="ico">↗</div>
              <div class="body">
                <div class="eyebrow">出行提醒</div>
                <div class="msg">${d.msg}</div>
                <div class="sub">${d.sub}</div>
              </div>
              <button type="button" class="cta">${d.cta}</button>
            </div>
          </div>`;
      }
      if (s.action === "cold") {
        const c = s.cold;
        return `
          <div class="primary">
            <div class="cold" id="act">
              <div class="msg">${c.msg}</div>
              <button type="button" class="cta">${c.cta}</button>
            </div>
          </div>`;
      }
      return `<div class="none-note">无主行动 · Tips 与冷启动都不出现</div>`;
    }

    function render() {
      const s = SCENES[scene];
      document.getElementById("label").textContent = s.label;
      document.getElementById("scroll").innerHTML = `
        <div class="poster-wrap" id="poster">
          <img src="${POSTER}" alt="" />
          <div class="poster-fade"></div>
          <div class="poster-meta">
            <h3>${s.show}</h3>
            <p>${s.meta}</p>
          </div>
        </div>
        ${countdownHTML(s.countdown)}
        ${actionHTML(s)}
      `;

      document.getElementById("poster").onclick = () => toast("进入现场详情");
      const act = document.getElementById("act");
      if (act) {
        act.onclick = () => {
          if (s.action === "tips") toast("打开猜歌单");
          else if (s.action === "depart") toast("打开地图");
          else if (s.action === "cold") toast("打开猜歌单");
        };
      }
    }

    document.querySelectorAll("[data-scene]").forEach((btn) => {
      btn.addEventListener("click", () => {
        scene = btn.dataset.scene;
        document.querySelectorAll("[data-scene]").forEach((b) => b.classList.toggle("active", b === btn));
        render();
      });
    });

    render();
  </script>
</body>
</html>
