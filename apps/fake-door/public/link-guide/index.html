    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="先选择你的购票平台，再按对应步骤从大麦、秀动、猫眼、票星球、纷玩岛、Ticketmaster、DICE、AXS 和 Live Nation 获取演出详情链接。"
    />
    <meta name="robots" content="index, follow" />

    <link rel="icon" href="/app-icon.png" type="image/png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050508;
        --surface: rgba(245, 241, 233, 0.06);
        --surface-strong: rgba(245, 241, 233, 0.09);
        --border: rgba(245, 241, 233, 0.12);
        --text: #f5f1e9;
        --text-soft: #aaa5af;
        --text-faint: #85808c;
        --accent: #84bfff;
        --accent-warm: #ffb36b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(ellipse 70% 45% at 50% 0%, rgba(132, 191, 255, 0.14), transparent 70%),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
        line-height: 1.8;
      }

      a { color: inherit; text-decoration: none; }

      button { font: inherit; }

      .wrap {
        width: min(760px, 100%);
        margin: 0 auto;
        padding: 48px 20px 88px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 42px;
      }

      .back {
        color: var(--text-soft);
        font-size: 14px;
      }

      .back:hover, .back:focus-visible { color: var(--accent); }

      .lang-switch {
        display: flex;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
      }

      .lang-switch button {
        padding: 4px 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--text-soft);
        font-size: 13px;
        cursor: pointer;
      }

      .lang-switch button.active {
        background: rgba(132, 191, 255, 0.16);
        color: var(--accent);
      }

      h1 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(34px, 7vw, 58px);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .lede {
        max-width: 620px;
        margin: 20px 0 0;
        color: var(--text-soft);
        font-size: 17px;
      }

      .quick-start {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 40px 0 54px;
      }

      .quick-step, .platform {
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--surface);
      }

      .quick-step { padding: 18px; }

      .step-number {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        margin-bottom: 13px;
        border-radius: 50%;
        background: rgba(132, 191, 255, 0.14);
        color: var(--accent);
        font-size: 13px;
        font-weight: 800;
      }

      .quick-step strong {
        display: block;
        margin-bottom: 4px;
        font-size: 15px;
      }

      .quick-step span { color: var(--text-soft); font-size: 13px; }

      h2 {
        margin: 46px 0 14px;
        font-size: 24px;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }

      .section-note {
        margin: 0 0 18px;
        color: var(--text-soft);
        font-size: 14px;
      }

      .platform-picker {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .platform-card {
        display: flex;
        flex-direction: column;
        gap: 3px;
        align-items: flex-start;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }

      .platform-card:hover, .platform-card:focus-visible {
        border-color: rgba(132, 191, 255, 0.45);
        background: var(--surface-strong);
      }

      .platform-card strong { font-size: 15px; }

      .platform-card span { color: var(--text-soft); font-size: 12px; }

      .platform-detail { margin-top: 26px; }

      .platform { padding: 20px; }

      .platform-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .platform h3 { margin: 0; font-size: 18px; }

      .platform h3 a {
        text-decoration: underline;
        text-decoration-color: rgba(132, 191, 255, 0.45);
        text-underline-offset: 4px;
      }

      .platform h3 a:hover, .platform h3 a:focus-visible { color: var(--accent); }

      .domain {
        color: var(--accent-warm);
        font-size: 12px;
        white-space: nowrap;
      }

      .platform ol {
        margin: 0;
        padding-left: 22px;
        color: var(--text-soft);
        font-size: 14px;
      }

      .platform li { padding-left: 4px; margin: 5px 0; }

      .picker-back {
        margin-top: 18px;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        color: var(--text-soft);
        font-size: 13px;
        cursor: pointer;
      }

      .picker-back:hover, .picker-back:focus-visible { color: var(--accent); border-color: rgba(132, 191, 255, 0.45); }

      .notice {
        margin-top: 42px;
        padding: 20px;
        border: 1px solid rgba(255, 179, 107, 0.28);
        border-radius: 20px;
        background: rgba(255, 179, 107, 0.07);
      }

      .notice strong { display: block; margin-bottom: 6px; color: var(--accent-warm); }
      .notice p { margin: 0; color: var(--text-soft); font-size: 14px; }

      .footer {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 20px;
        margin-top: 64px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        color: var(--text-faint);
        font-size: 13px;
      }

      .footer-link { color: var(--accent); }

      @media (max-width: 560px) {
        .wrap { padding-top: 32px; }
        .topbar { margin-bottom: 34px; }
        .quick-start, .platform-picker { grid-template-columns: 1fr; }
        .quick-start { margin: 32px 0 44px; }
        .quick-step { display: grid; grid-template-columns: 28px 1fr; column-gap: 12px; align-items: center; }
        .step-number { grid-row: span 2; margin: 0; }
        .quick-step strong { margin: 0; }
        .platform-header { display: block; }
        .domain { display: block; margin-top: 3px; }
      }
    </style>
  </head>

    <main class="wrap">
      <div class="topbar">
        <a class="back" data-i18n="back" href="/">← 返回首页</a>
        <nav class="lang-switch" aria-label="Language">
          <button type="button" data-set-lang="zh-Hans">简体</button>
          <button type="button" data-set-lang="zh-Hant">繁體</button>
          <button type="button" data-set-lang="en">EN</button>
        </nav>
      </div>

      <h1 data-i18n="title">如何获取票务链接</h1>
      <p class="lede" data-i18n="lede"></p>

      <section class="quick-start" aria-label="Steps">
        <div class="quick-step">
          <span class="step-number">1</span>
          <strong data-i18n="quick1t"></strong>
          <span data-i18n="quick1d"></span>
        </div>
        <div class="quick-step">
          <span class="step-number">2</span>
          <strong data-i18n="quick2t"></strong>
          <span data-i18n="quick2d"></span>
        </div>
        <div class="quick-step">
          <span class="step-number">3</span>
          <strong data-i18n="quick3t"></strong>
          <span data-i18n="quick3d"></span>
        </div>
      </section>

      <section id="pickerStep">
        <h2 data-i18n="pickerTitle"></h2>
        <p class="section-note" data-i18n="pickerNote"></p>
        <div class="platform-picker" id="platformPicker"></div>
      </section>

      <section id="detailStep" class="platform-detail" hidden>
        <h2 id="detailTitle"></h2>
        <p class="section-note" data-i18n="detailNote"></p>
        <article class="platform">
          <div class="platform-header">
            <h3><a id="detailLink"></a></h3>
            <span class="domain" id="detailDomain"></span>
          </div>
          <ol id="detailSteps"></ol>
        </article>
        <aside class="notice">
          <strong data-i18n="noticeTitle"></strong>
          <p data-i18n="notice"></p>
        </aside>
        <button class="picker-back" id="backToPicker" type="button"></button>
      </section>

      <footer class="footer">
        <span data-i18n="copyright"></span>
        <a class="footer-link" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">浙ICP备2026041359号-2</a>
        <a class="footer-link" href="/privacy" data-i18n="privacyLink"></a>
        <a class="footer-link" href="/terms" data-i18n="termsLink"></a>
        <a class="footer-link" href="/" data-i18n="homeLink"></a>
      </footer>
    </main>

          "zh-Hant": ["開啟 Live Nation 總覽頁，搜尋你要新增的演出。", "點擊搜尋結果，進入對應的演出詳情頁。", "複製此時瀏覽器網址列裡的頁面網址，回到 BeforeShow 貼上並開始解析。"],
          en: ["Open the Live Nation overview page and search for your show.", "Tap the search result to open its details page.", "Copy the URL from the address bar and paste it back in BeforeShow to parse."]
        }
      };

      var platforms = [
        { key: "damai", url: "https://m.damai.cn/shows/home.html", domain: "m.damai.cn" },
        { key: "showstart", url: "https://showstart.com/", domain: "showstart.com" },
        { key: "maoyan", url: "https://show.maoyan.com/qqw/", domain: "maoyan.com" },
        { key: "piaoxingqiu", url: "https://e.piaoxingqiu.com/", domain: "e.piaoxingqiu.com" },
        { key: "fenwandao", url: "https://www.livelab.com.cn/", domain: "livelab.com.cn" },
        { key: "ticketmaster", url: "https://www.ticketmaster.com/", domain: "ticketmaster.*" },
        { key: "dice", url: "https://dice.fm/", domain: "dice.fm" },
        { key: "axs", url: "https://www.axs.com/", domain: "axs.com" },
        { key: "livenation", url: "https://www.livenation.com/", domain: "livenation.com" }
      ];

      var picker = document.getElementById("platformPicker");
      var pickerStep = document.getElementById("pickerStep");
      var detailStep = document.getElementById("detailStep");
      var detailTitle = document.getElementById("detailTitle");
      var detailLink = document.getElementById("detailLink");
      var detailDomain = document.getElementById("detailDomain");
      var detailSteps = document.getElementById("detailSteps");
      var backToPicker = document.getElementById("backToPicker");
      var currentPlatform = null;

      function renderCopy() {
        var t = copy[LANG];
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (key in t) el.textContent = t[key];
        });
        document.documentElement.lang = LANG === "en" ? "en" : LANG === "zh-Hant" ? "zh-Hant" : "zh-Hans";
        document.querySelectorAll("[data-set-lang]").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-set-lang") === LANG);
        });
      }

      function renderDetail(platform) {
        currentPlatform = platform;
        var c = copy[LANG];
        var names = platformNames[LANG];
        detailTitle.textContent = names[platform.key];
        detailLink.textContent = c.openOverview + " " + names[platform.key] + " " + c.overviewSuffix;
        detailLink.href = platform.url;
        detailDomain.textContent = platform.domain;
        detailSteps.innerHTML = "";
        var steps = platformSteps[platform.key][LANG];
        for (var j = 0; j < steps.length; j++) {
          var li = document.createElement("li");
          li.textContent = steps[j];
          detailSteps.appendChild(li);
        }
        pickerStep.hidden = true;
        detailStep.hidden = false;
      }

      function renderPicker() {
        picker.innerHTML = "";
        var names = platformNames[LANG];
        for (var i = 0; i < platforms.length; i++) {
          (function (platform) {
            var card = document.createElement("button");
            card.type = "button";
            card.className = "platform-card";
            card.innerHTML = "<strong>" + names[platform.key] + "</strong><span>" + platform.domain + "</span>";
            card.addEventListener("click", function () {
              renderDetail(platform);
              window.scrollTo({ top: 0, behavior: "smooth" });
            });
            picker.appendChild(card);
          })(platforms[i]);
        }
      }

      backToPicker.addEventListener("click", function () {
        detailStep.hidden = true;
        pickerStep.hidden = false;
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      document.querySelectorAll("[data-set-lang]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          LANG = btn.getAttribute("data-set-lang");
          try { localStorage.setItem("bs-lang", LANG); } catch (e) {}
          renderCopy();
          renderPicker();
          if (currentPlatform) renderDetail(currentPlatform);
        });
      });

      renderCopy();
      renderPicker();
    </script>
  </body>
</html>
