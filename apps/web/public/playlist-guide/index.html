    <meta
      name="description"
      content="把开场前 BeforeShow 里的现场歌单导出为图片或文字，再导入 QQ 音乐、网易云音乐和汽水音乐的图文教程。"

    <meta name="robots" content="index, follow" />

    <style>
      :root {
        color-scheme: dark;
        --bg: #050508;
        --surface: rgba(245, 241, 233, 0.06);
        --surface-strong: rgba(245, 241, 233, 0.09);
        --border: rgba(245, 241, 233, 0.12);
        --text: #f5f1e9;
        --text-soft: #aaa5af;
        --text-faint: #85808c;
        --accent: #84bfff;
        --accent-warm: #ffb36b;
        --ok: #8fd6a3;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(ellipse 70% 45% at 50% 0%, rgba(255, 179, 107, 0.12), transparent 70%),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
        line-height: 1.8;
      }

      a { color: inherit; text-decoration: none; }
      button { font: inherit; }

      .wrap {
        width: min(760px, 100%);
        margin: 0 auto;
        padding: 48px 20px 88px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 42px;
      }

      .back { color: var(--text-soft); font-size: 14px; }
      .back:hover, .back:focus-visible { color: var(--accent); }

      .lang-switch {
        display: flex;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
      }

      .lang-switch button {
        padding: 4px 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--text-soft);
        font-size: 13px;
        cursor: pointer;
      }

      .lang-switch button.active { background: rgba(132, 191, 255, 0.16); color: var(--accent); }

      h1 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(34px, 7vw, 54px);
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      .lede { max-width: 620px; margin: 20px 0 0; color: var(--text-soft); font-size: 17px; }

      .methods {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 36px 0 8px;
      }

      .method {
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
      }

      .method strong { display: block; font-size: 15px; margin-bottom: 8px; }

      .chips { display: flex; flex-wrap: wrap; gap: 6px; }

      .chip {
        padding: 1px 10px;
        border-radius: 999px;
        font-size: 12px;
        border: 1px solid var(--border);
        color: var(--text-faint);
      }

      .chip.ok { border-color: rgba(143, 214, 163, 0.4); color: var(--ok); background: rgba(143, 214, 163, 0.08); }

      h2 {
        margin: 54px 0 6px;
        font-size: 24px;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }

      .step-label {
        display: inline-block;
        margin-top: 54px;
        color: var(--accent-warm);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .step-label + h2 { margin-top: 4px; }

      .section-note { margin: 0 0 18px; color: var(--text-soft); font-size: 14px; }

      .export {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 28px;
        align-items: start;
        margin-top: 18px;
      }

      .phone {
        margin: 0;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 34px;
        background: #111;
      }

      .phone img { display: block; width: 100%; height: auto; border-radius: 27px; }

      .phone figcaption { padding: 8px 6px 2px; color: var(--text-faint); font-size: 12px; text-align: center; }

      .export ol, .platform ol {
        margin: 0;
        padding-left: 22px;
        color: var(--text-soft);
        font-size: 15px;
      }

      .export li, .platform li { padding-left: 4px; margin: 8px 0; }
      .export li strong, .platform li strong { color: var(--text); }

      .where { margin-top: 18px; }
      .where span { display: block; color: var(--text); font-size: 14px; margin-bottom: 6px; }

      .tabs {
        display: flex;
        gap: 8px;
        margin: 18px 0 16px;
        flex-wrap: wrap;
      }

      .tabs button {
        padding: 8px 18px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text-soft);
        font-size: 14px;
        cursor: pointer;
      }

      .tabs button.active {
        border-color: rgba(255, 179, 107, 0.5);
        background: rgba(255, 179, 107, 0.12);
        color: var(--accent-warm);
      }

      .platform {
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--surface);
      }

      .path {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 4px;
        margin: 0 0 18px;
        padding: 14px;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.35);
      }

      .path b {
        padding: 4px 12px;
        border-radius: 10px;
        background: var(--surface-strong);
        border: 1px solid var(--border);
        font-size: 13px;
        font-weight: 600;
      }

      .path b.goal { border-color: rgba(255, 179, 107, 0.5); color: var(--accent-warm); }
      .path i { color: var(--text-faint); font-style: normal; font-size: 13px; padding: 0 2px; }

      .notice {
        margin-top: 42px;
        padding: 20px;
        border: 1px solid rgba(255, 179, 107, 0.28);
        border-radius: 20px;
        background: rgba(255, 179, 107, 0.07);
      }

      .notice strong { display: block; margin-bottom: 6px; color: var(--accent-warm); }
      .notice ul { margin: 0; padding-left: 20px; color: var(--text-soft); font-size: 14px; }
      .notice li { margin: 4px 0; }

      .updated { margin-top: 14px; color: var(--text-faint); font-size: 12px; }

      .footer {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 20px;
        margin-top: 64px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        color: var(--text-faint);
        font-size: 13px;
      }

      .footer-link { color: var(--accent); }

      @media (max-width: 600px) {
        .wrap { padding-top: 32px; }
        .topbar { margin-bottom: 34px; }
        .methods { grid-template-columns: 1fr; }
        .export { grid-template-columns: 1fr; }
        .phone { max-width: 280px; margin: 0 auto; }
        .platform { padding: 18px; }
      }
    </style>
  </head>

      </footer>

            "zh-Hans": ["先导入 QQ 音乐或网易云音乐", "分享歌单链接", "汽水音乐 · 我的 · 歌单 · +", "导入外部歌单"],
            "zh-Hant": ["先導入 QQ 音樂或網易雲音樂", "分享歌單連結", "汽水音樂 · 我的 · 歌單 · +", "導入外部歌單"],
            en: ["Import into QQ Music or NetEase first", "Share the playlist link", "Soda Music · Me · Playlists · +", "Import External Playlist"]
          },
          steps: {
            "zh-Hans": [
              "汽水音乐只能导入其他平台的歌单链接，所以先按 <strong>QQ 音乐</strong> 或 <strong>网易云音乐</strong> 的步骤导入一次。",
              "在那个 App 里把导入好的歌单设为 <strong>公开</strong>，点 <strong>分享</strong> → <strong>复制链接</strong>（要复制歌单链接，不是单曲链接）。",
              "打开汽水音乐，进入 <strong>我的</strong> → <strong>歌单</strong>，点右上角 <strong>+</strong>，选 <strong>导入外部歌单</strong>。",
              "粘贴链接开始导入，完成后检查结果。"
            ],
            "zh-Hant": [
              "汽水音樂只能導入其他平台的歌單連結，所以先依 <strong>QQ 音樂</strong> 或 <strong>網易雲音樂</strong> 的步驟導入一次。",
              "在那個 App 裡把導入好的歌單設為 <strong>公開</strong>，點 <strong>分享</strong> → <strong>複製連結</strong>（要複製歌單連結，不是單曲連結）。",
              "打開汽水音樂，進入 <strong>我的</strong> → <strong>歌單</strong>，點右上角 <strong>+</strong>，選 <strong>導入外部歌單</strong>。",
              "貼上連結開始導入，完成後檢查結果。"
            ],
            en: [
              "Soda Music only imports playlist links from other apps, so first import into <strong>QQ Music</strong> or <strong>NetEase Cloud Music</strong>.",
              "There, make the imported playlist <strong>public</strong>, then <strong>Share</strong> → <strong>Copy Link</strong> (the playlist's link, not a song's).",
              "Open Soda Music, go to <strong>Me</strong> → <strong>Playlists</strong>, tap <strong>+</strong> at the top right and choose <strong>Import External Playlist</strong>.",
              "Paste the link to import, then check the result."
            ]
          }
        }
      ];

      var current = apps[0];

      function list(el, items, html) {
        el.innerHTML = "";
        items.forEach(function (item) {
          var li = document.createElement("li");
          if (html) li.innerHTML = item; else li.textContent = item;
          el.appendChild(li);
        });
      }

      function chip(text, ok) {
        var span = document.createElement("span");
        span.className = ok ? "chip ok" : "chip";
        span.textContent = text;
        return span;
      }

      function renderMethods() {
        var t = copy[LANG];
        var box = document.getElementById("methods");
        box.innerHTML = "";
        apps.forEach(function (app) {
          var card = document.createElement("div");
          card.className = "method";
          var name = document.createElement("strong");
          name.textContent = app.name[LANG];
          var chips = document.createElement("div");
          chips.className = "chips";
          ["image", "text", "link"].forEach(function (kind) {
            var ok = app.supports.indexOf(kind) !== -1;
            chips.appendChild(chip((ok ? "✓ " : "— ") + t.supports[kind], ok));
          });
          card.appendChild(name);
          card.appendChild(chips);
          box.appendChild(card);
        });
      }

      function renderPlatform() {
        var tabs = document.getElementById("tabs");
        tabs.innerHTML = "";
        apps.forEach(function (app) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", app === current ? "true" : "false");
          btn.className = app === current ? "active" : "";
          btn.textContent = app.name[LANG];
          btn.addEventListener("click", function () { current = app; renderPlatform(); });
          tabs.appendChild(btn);
        });
        var path = document.getElementById("path");
        path.innerHTML = "";
        var parts = current.path[LANG];
        parts.forEach(function (part, i) {
          var b = document.createElement("b");
          b.textContent = part;
          if (i === parts.length - 1) b.className = "goal";
          path.appendChild(b);
          if (i < parts.length - 1) {
            var arrow = document.createElement("i");
            arrow.textContent = "→";
            path.appendChild(arrow);
          }
        });
        list(document.getElementById("platformSteps"), current.steps[LANG], true);
      }

      function render() {
        var t = copy[LANG];
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (typeof t[key] === "string") el.textContent = t[key];
        });
        document.querySelectorAll("[data-i18n-alt]").forEach(function (el) {
          el.setAttribute("alt", t[el.getAttribute("data-i18n-alt")]);
        });
        document.title = t.title + " — " + (LANG === "en" ? "BeforeShow" : "开场前 BeforeShow");
        document.documentElement.lang = LANG === "en" ? "en" : LANG === "zh-Hant" ? "zh-Hant" : "zh-Hans";
        document.querySelectorAll("[data-set-lang]").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-set-lang") === LANG);
        });
        list(document.getElementById("exportSteps"), t.exportSteps, true);
        var where = document.getElementById("whereChips");
        where.innerHTML = "";
        t.where.forEach(function (w) { where.appendChild(chip(w, false)); });
        list(document.getElementById("notice"), t.notice, false);
        renderMethods();
        renderPlatform();
      }

      document.querySelectorAll("[data-set-lang]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          LANG = btn.getAttribute("data-set-lang");
          try { localStorage.setItem("bs-lang", LANG); } catch (e) {}
          render();
        });
      });

      render();
    </script>
  </body>
</html>
