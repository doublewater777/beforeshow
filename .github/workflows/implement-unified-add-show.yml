name: Implement unified add show

on:
  push:
    branches:
      - feat/unified-add-show
    paths:
      - .github/workflows/implement-unified-add-show.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tests and implementation
        run: |
          set -euo pipefail
          python3 .github/scripts/implement_unified_add_show.py tests
          python3 .github/scripts/implement_unified_add_show.py implementation
          git diff --check
          git status --short

      - name: Commit patch
        run: |
          set -euo pipefail
          rm .github/scripts/implement_unified_add_show.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: unify add show flow'
          git push origin HEAD:feat/unified-add-show
