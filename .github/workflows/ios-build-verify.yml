name: iOS build verify

on:
  push:
    branches:
      - main
    paths:
      - "apps/ios/**"
      - "scripts/verify-pr.sh"
      - ".github/workflows/ios-build-verify.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/ios/**"
      - "scripts/verify-pr.sh"
      - ".github/workflows/ios-build-verify.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ios-build-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, xcode-26]
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Phase 1 PR verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-pr.sh "${{ github.event.pull_request.number }}" --no-comment

  verify-main:
    if: github.event_name == 'push'
    runs-on: [self-hosted, xcode-26]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Architecture guard
        run: python3 apps/ios/scripts/check_architecture.py

      - name: Signed simulator build
        run: |
          cd apps/ios
          xcodebuild -project BeforeShow.xcodeproj -scheme BeforeShow \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -allowProvisioningUpdates DEVELOPMENT_TEAM=29C8MS76CZ build
