name: Polish body shell asset

on:
  push:
    branches:
      - feat/listening-ui-refactor
    paths:
      - ".github/workflows/body-shell-polish.yml"
      - ".tmp/body-shell-v8/**"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build polished body shell
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow opencv-python-headless numpy
          ASSET="apps/ios/BeforeShow/Resources/ListeningPlayer.xcassets/listen_01_body_shell.imageset/01_body_shell.png"
          git show 42a5f26bd672343c93d5ea1300211bb4f9ab9a66:"$ASSET" > /tmp/body-original.png

          python <<'PY'
          import cv2
          import numpy as np
          from PIL import Image

          src = "/tmp/body-original.png"
          dst = "apps/ios/BeforeShow/Resources/ListeningPlayer.xcassets/listen_01_body_shell.imageset/01_body_shell.png"

          img = cv2.imread(src, cv2.IMREAD_UNCHANGED)
          if img is None or img.shape != (483, 435, 4):
              raise SystemExit(f"unexpected source shape: {None if img is None else img.shape}")

          bgr = img[:, :, :3].copy()
          alpha = img[:, :, 3].copy()

          def clean_bright_text(roi, threshold):
              x1, y1, x2, y2 = roi
              patch = bgr[y1:y2, x1:x2]
              gray = cv2.cvtColor(patch, cv2.COLOR_BGR2GRAY)
              kernel = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (5, 5))
              tophat = cv2.morphologyEx(gray, cv2.MORPH_TOPHAT, kernel)
              mask = ((gray > threshold) & (tophat > 18)).astype(np.uint8) * 255
              mask = cv2.dilate(mask, np.ones((3, 3), np.uint8), iterations=1)
              bgr[y1:y2, x1:x2] = cv2.inpaint(patch, mask, 2, cv2.INPAINT_TELEA)

          # Remove only the printed glyphs, preserving the original sharp plastic texture.
          clean_bright_text((55, 386, 111, 401), 125)   # SKIP/SEARCH
          clean_bright_text((281, 386, 338, 401), 125)  # POWER OFF
          clean_bright_text((218, 462, 265, 478), 120)  # REPEAT
          clean_bright_text((269, 456, 326, 476), 120)  # MEMORY
          clean_bright_text((368, 386, 416, 412), 120)  # OPEN

          # Replace only the warning plaque interior with matched, real source texture.
          # The recessed border remains untouched.
          rgba = np.dstack([bgr, alpha]).astype(np.float32)
          x1, y1, x2, y2 = 292, 230, 360, 270
          w, h = x2 - x1, y2 - y1
          sx1, sy1 = 225, 112
          donor = rgba[sy1:sy1+h, sx1:sx1+w, :3].copy()
          target = rgba[y1:y2, x1:x2, :3].copy()
          donor += target.reshape(-1, 3).mean(0) - donor.reshape(-1, 3).mean(0)
          donor = np.clip(donor, 0, 255)
          yy, xx = np.mgrid[0:h, 0:w]
          edge = np.minimum.reduce([xx, yy, w - 1 - xx, h - 1 - yy]).astype(np.float32)
          blend = np.clip((edge - 1) / 5, 0, 1)[..., None]
          rgba[y1:y2, x1:x2, :3] = target * (1 - blend) + donor * blend
          bgr = rgba[:, :, :3].astype(np.uint8)

          # Hardware-style lid-open/eject glyph centered on the rightmost button.
          pts = np.array([[382, 407], [390, 398], [398, 407]], np.int32)
          for dx, dy, color, width in [
              (1, 1, (20, 20, 20), 3),
              (0, 0, (228, 228, 220), 2),
          ]:
              cv2.polylines(
                  bgr,
                  [pts + np.array([dx, dy])],
                  False,
                  color,
                  width,
                  lineType=cv2.LINE_AA,
              )
              cv2.line(
                  bgr,
                  (383 + dx, 413 + dy),
                  (397 + dx, 413 + dy),
                  color,
                  width,
                  lineType=cv2.LINE_AA,
              )

          out = np.dstack([bgr, alpha])
          if not cv2.imwrite(dst, out, [cv2.IMWRITE_PNG_COMPRESSION, 9]):
              raise SystemExit("failed to write PNG")
          PY

          file "$ASSET"
          file "$ASSET" | grep -F "PNG image data, 435 x 483, 8-bit/color RGBA"

      - name: Commit polished PNG
        shell: bash
        run: |
          set -euo pipefail
          ASSET="apps/ios/BeforeShow/Resources/ListeningPlayer.xcassets/listen_01_body_shell.imageset/01_body_shell.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ASSET"
          git diff --cached --quiet && exit 0
          git commit -m "Polish body shell controls and open icon"
          git push origin HEAD:feat/listening-ui-refactor
