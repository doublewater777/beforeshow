name: iOS

on:
  pull_request:
    # edited：改 base / 标题描述时也重跑，避免改 base 后仍显示旧合并快照的绿色
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      # 固定与本地开发一致的 Xcode 26（iOS 26 SDK），
      # 不使用 runner 上版本不确定的 /Applications/Xcode.app 软链接。
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Build
        run: xcodebuild -scheme BeforeShow -destination 'generic/platform=iOS Simulator' build

      - name: Test
        run: xcodebuild -scheme BeforeShow -destination 'platform=iOS Simulator,name=iPhone 17' test
