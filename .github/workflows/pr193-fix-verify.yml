name: PR 193 fix verify

on:
  push:
    branches:
      - feat/listening-mini-player-morph
    paths:
      - ".github/workflows/pr193-fix-verify.yml"

permissions:
  contents: write

jobs:
  generate-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show Swift toolchain
        run: swift --version

      - name: Build XcodeGen
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/yonaskolb/XcodeGen.git "$RUNNER_TEMP/XcodeGen"
          cd "$RUNNER_TEMP/XcodeGen"
          swift build -c release --product xcodegen
          echo "XCODEGEN=$RUNNER_TEMP/XcodeGen/.build/release/xcodegen" >> "$GITHUB_ENV"

      - name: Generate and commit project references
        run: |
          set -euo pipefail
          cd apps/ios
          "$XCODEGEN" generate
          grep -q 'ListeningMiniPlayerChrome.swift' BeforeShow.xcodeproj/project.pbxproj
          grep -q 'ListeningMiniPlayerChromeTests.swift' BeforeShow.xcodeproj/project.pbxproj
          cd ../..
          if ! git diff --quiet -- apps/ios/BeforeShow.xcodeproj/project.pbxproj; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/ios/BeforeShow.xcodeproj/project.pbxproj
            git commit -m 'Regenerate iOS project for mini player chrome'
            git push origin HEAD:feat/listening-mini-player-morph
          fi

      - name: Verify XcodeGen idempotency
        run: |
          set -euo pipefail
          cd apps/ios
          "$XCODEGEN" generate
          cd ../..
          git diff --exit-code -- apps/ios/BeforeShow.xcodeproj/project.pbxproj

      - name: Architecture guard
        run: python3 apps/ios/scripts/check_architecture.py
